  if (isSow) renderDeliverableRows();
  wireContractToolbar(docId);
  wireContractFields(docId);
  refreshContractPreview(docId);

  const pick = $('#docFromCampaign');
  if (pick) pick.addEventListener('change', () => {
    const cp = byCampaign[pick.value];
    if (!cp) return;
    CONTRACT.clientName = cp.brand || CONTRACT.clientName;
    CONTRACT.campaignName = cp.name || '';
    CONTRACT.campaignPurpose = cp.deliverables || '';
    CONTRACT.platforms = (cp.platforms || []).join(', ');
    CONTRACT.periodStart = cp.start || '';
    CONTRACT.periodEnd = cp.end || '';
    if (cp.budget) CONTRACT.fee = String(cp.budget);
    toast('Prefilled from ' + cp.brand);
    render();
  });
  const add = $('#delivAdd');
  if (add) add.addEventListener('click', () => {
    CONTRACT.deliverables.push({ service: '', platform: '', qty: '', deadline: '' });
    renderDeliverableRows(); refreshContractPreview(docId);
  });
}

function renderDeliverableRows() {
  const wrap = $('#delivRows');
  if (!wrap) return;
  wrap.innerHTML = CONTRACT.deliverables.map((d, i) => `
    <div style="display:grid;grid-template-columns:1.6fr 1fr .7fr 1fr 28px;gap:6px;margin-bottom:6px">
      <input type="text" data-dv="${i}.service" value="${esc(d.service)}" placeholder="Service / deliverable" style="padding:6px 9px;font-size:12.5px"/>
      <input type="text" data-dv="${i}.platform" value="${esc(d.platform)}" placeholder="Platform" style="padding:6px 9px;font-size:12.5px"/>
      <input type="text" data-dv="${i}.qty" value="${esc(d.qty)}" placeholder="Qty" style="padding:6px 9px;font-size:12.5px"/>
      <input type="text" data-dv="${i}.deadline" value="${esc(d.deadline)}" placeholder="Deadline" style="padding:6px 9px;font-size:12.5px"/>
      <button class="icon-btn" data-dvdel="${i}" title="Remove" style="width:28px;height:28px;font-size:14px">&times;</button>
    </div>`).join('');
  $$('[data-dvdel]', wrap).forEach((b) => b.addEventListener('click', () => {
    CONTRACT.deliverables.splice(+b.dataset.dvdel, 1);
    if (!CONTRACT.deliverables.length) CONTRACT.deliverables.push({ service: '', platform: '', qty: '', deadline: '' });
    renderDeliverableRows(); refreshContractPreview('sow');
  }));
  $$('[data-dv]', wrap).forEach((inp) => inp.addEventListener('input', () => {
    const [i, key] = inp.dataset.dv.split('.');
    CONTRACT.deliverables[+i][key] = inp.value;
    refreshContractPreview('sow');
  }));
}

const CONTRACT_NUMERIC = new Set(['netDays','lateInterest','cancelFee','cancelWindowDays','reviewDays','revisionRounds',
  'nonCircMonths','nonCircPenalty','confidentialityYears','termYears','cureDays','forceMajeureDays']);

function wireContractFields(docId) {
  $$('[data-cf]').forEach((el) => {
    const key = el.dataset.cf;
    const handler = () => {
      CONTRACT[key] = CONTRACT_NUMERIC.has(key) ? (el.value === '' ? '' : Number(el.value)) : el.value;
      if (key === 'billing') {
        const w = $('#billingCustomWrap');
        if (w) w.style.display = el.value === 'custom' ? '' : 'none';
      }
      saveContractDefaults();
      refreshContractPreview(docId);
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  $$('[data-cc]').forEach((el) => el.addEventListener('change', () => {
    CONTRACT.clauses[el.dataset.cc] = el.checked;
    refreshContractPreview(docId);
  }));
}

        <td>${c.flagAt || '—'}</td><td class="num">${c.campaignsDone || '—'}</td>
        <td><button class="btn xs" onclick="event.stopPropagation();clearFlag('${c.id}')">Clear flag</button></td></tr>`).join('')
        : `<tr><td colspan="6"><div class="empty">Nobody is flagged. Open any creator and use “Flag this creator”.</div></td></tr>`}</tbody></table>
    </div></div>`;

  $('#setHideBlocked').addEventListener('change', (e) => { SETTINGS.hideBlocked = e.target.checked; toast('Saved'); });
}

function clearFlag(id) {
  const c = byCreator[id];
  if (!c) return;
  c.flag = null; c.flagReason = ''; c.flagAt = null;
  toast(c.handle + ' — flag cleared'); render();
}

async function restoreBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const saved = JSON.parse(await f.text());
    const db = saved.db || saved;
    if (!db || !Array.isArray(db.creators) || !Array.isArray(db.campaigns)) throw new Error('That file is not a VIVELY workspace backup.');
    clearPersisted();
    DB.creators = db.creators; DB.campaigns = db.campaigns; DB.participants = db.participants || [];
    DB.creators.forEach((c) => (byCreator[c.id] = c));
    DB.campaigns.forEach((c) => (byCampaign[c.id] = c));
    if (saved.settings && typeof saved.settings.hideBlocked === 'boolean') SETTINGS.hideBlocked = saved.settings.hideBlocked;
    persist(true);
    toast(`Restored ${DB.campaigns.length} campaigns and ${DB.creators.length} creators`);
    render();
  } catch (err) { toast('Restore failed — ' + err.message); }
}

async function importCreatorsCsv(e) {
  const f = e.target.files[0]; if (!f) return;
  const text = await f.text();
  const [head, ...lines] = text.trim().split(/\r?\n/);
  const cols = head.split(',').map((h) => h.trim().toLowerCase());
  let n = 0, dup = 0;
  lines.forEach((l) => {
    const v = l.split(',');
    const get = (k) => { const i = cols.indexOf(k); return i >= 0 ? (v[i] || '').trim().replace(/^"|"$/g, '') : ''; };
    const handle = get('handle'); if (!handle) return;
    const id = 'im' + (DB.creators.length + 1) + n;
    const followers = +get('followers') || 0;
    const c = {
      id, handle: handle.startsWith('@') ? handle : '@' + handle, name: get('name') || handle,
      platform: get('platform') || 'Instagram', followers, er: +get('er') || 0,
      avgViews: +get('avg_views') || Math.round(followers * 0.8),
      categories: (get('categories') || 'Lifestyle').split('|'), country: get('country') || 'Korea',
      languages: ['EN'], tier: tierOf(followers).id, source: 'Imported CSV', rate: +get('rate_krw') || 0,
      reliability: null, avgTurnaroundDays: null, campaignsDone: 0, lastWorked: null,
      email: get('email') || '', tags: [], notes: '', campaignIds: [], contentCount: 0, totalViews: 0, bestViews: 0
    };
    DB.creators.push(c); byCreator[id] = c; n++;
  });
  mergeDuplicateCreators();
  toast(`${n} creators imported${dup ? `, ${dup} already in the database` : ''}`); render();
}

/* ============================================================
   SHELL — three layers
   ============================================================ */
const SECTIONS = [
  { id: 'overview',  icon: '⌂', label: 'Overview' },
  { id: 'campaigns', icon: '▤', label: 'Campaigns', badge: () => activeCampaigns().length },
  { id: 'messages',  icon: '✉', label: 'Messages' },
  { id: 'creators',  icon: '◎', label: 'Creators', badge: () => DB.creators.length },
  { id: 'contracts', icon: '§', label: 'Contracts' },
  { id: 'analytics', icon: '◫', label: 'Analytics' },
  { id: 'settings',  icon: '⚙', label: 'Setup' }
];

function defaultItem(section) {
  return { overview: 'summary', campaigns: 'all', creators: 'all', analytics: 'trend', contracts: 'msa',
           settings: 'templates', messages: (activeCampaigns()[0] || DB.campaigns[0] || {}).id }[section] || '';
}

function tabsFor(section, item) {
  if (section === 'overview')  return OVERVIEW_TABS[item] || OVERVIEW_TABS.summary;
  if (section === 'analytics') return ANALYTICS_TABS[item] || ANALYTICS_TABS.trend;
  if (section === 'creators')  return CREATOR_TABS;
  if (section === 'contracts') return CONTRACT_TABS;
  if (section === 'messages')  return MSG_KINDS.map(([k, l]) => [k, l]);
  if (section === 'campaigns') return (!item || item === 'all')
    ? [['active', 'Active'], ['all', 'All'], ['wrapped', 'Wrapped']]
    : CAMPAIGN_TABS;
  return [];
}

function panelFor(section, item) {
  const q = state.panelQ.trim().toLowerCase();
  const match = (s) => !q || s.toLowerCase().includes(q);

  if (section === 'overview')
    return { title: 'Overview', groups: [{ items: OVERVIEW_ITEMS.map((o) => ({ id: o.id, title: o.label, sub: o.sub })) }] };

  if (section === 'analytics')
    return { title: 'Analytics', groups: [{ items: ANALYTICS_ITEMS.map((o) => ({ id: o.id, title: o.label, sub: o.sub })) }] };

  if (section === 'settings')
    return { title: 'Setup', groups: [{ items: SETTINGS_ITEMS.map((o) => ({ id: o.id, title: o.label, sub: o.sub })) }] };

  if (section === 'contracts')
    return { title: 'Documents', groups: [{ items: Object.values(CONTRACT_DOCS).map((d) => ({ id: d.id, title: d.label, sub: d.sub })) }] };

  if (section === 'creators')
    return { title: 'Segments', search: true, searchPlaceholder: 'Filter segments…',
      groups: [{ items: CREATOR_SEGMENTS.filter((s) => match(s.label))
        .map((s) => ({ id: s.id, title: s.label, right: num(DB.creators.filter(s.test).length) })) }] };

  /* campaigns + messages both browse the campaign list */
  const order = ['live', 'production', 'confirming', 'outreach', 'planning', 'wrapped'];
  const groups = [];
  if (section === 'campaigns' && match('all campaigns'))
    groups.push({ items: [{ id: 'all', title: 'All campaigns', sub: `${DB.campaigns.length} total`, plain: true }] });
  order.forEach((st) => {
    const items = DB.campaigns.filter((c) => c.status === st && (match(c.brand) || match(c.name) || match(c.kind) || match(c.market)));
    if (!items.length) return;
    groups.push({
      label: CAMPAIGN_STATUS[st].label,
      items: items.map((c) => {
        const s = campaignStats(c);
        return { id: c.id, title: c.brand, sub: `${c.kind} · ${c.market}`,
                 right: s.delivered ? kmb(s.views) : `${s.confirmed}/${c.targetCreators}`,
                 dot: { live: 'var(--good)', production: 'var(--warning)', confirming: 'var(--s5)',
                        outreach: 'var(--s1)', planning: 'var(--text-3)', wrapped: 'var(--text-3)' }[st] };
      })
    });
  });
  return { title: section === 'messages' ? 'Pick a campaign' : 'Campaigns', search: true, searchPlaceholder: 'Filter campaigns…', groups };
}

function titleFor(section, item) {
  if (section === 'campaigns') return (!item || item === 'all') ? 'Campaigns' : (byCampaign[item] || {}).brand || 'Campaign';
  if (section === 'messages')  return (byCampaign[item] || {}).brand || 'Messages';
  if (section === 'creators')  return segmentOf(item).label;
  if (section === 'analytics') return (ANALYTICS_ITEMS.find((x) => x.id === item) || {}).label || 'Analytics';
  if (section === 'contracts') return (CONTRACT_DOCS[item] || CONTRACT_DOCS.msa).label;
  if (section === 'settings')  return (SETTINGS_ITEMS.find((x) => x.id === item) || {}).label || 'Setup';
  return (OVERVIEW_ITEMS.find((x) => x.id === item) || {}).label || 'Overview';
}

function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  let section = parts[0] || 'overview';
  if (!SECTIONS.some((s) => s.id === section)) section = 'overview';
  const item = parts[1] || defaultItem(section);
  const tabs = tabsFor(section, item);
  const tab = parts[2] || (tabs[0] ? tabs[0][0] : '');
  return { section, item, tab, tabs };
}

function renderRail(section) {
  $('#rail').innerHTML = SECTIONS.map((s) => `<a class="rail-item ${s.id === section ? 'active' : ''}" href="#/${s.id}">
      <span class="ico">${s.icon}</span><span class="lb">${s.label}</span>
      ${s.badge ? `<span class="dotb">${s.badge()}</span>` : ''}</a>`).join('');
}

function renderPanel(section, item) {
  const p = panelFor(section, item);
  $('#panelTitle').textContent = p.title;
  const sw = $('#panelSearchWrap');
  sw.style.display = p.search ? '' : 'none';
  if (p.search) {
    const inp = $('#panelQ');
    inp.placeholder = p.searchPlaceholder || 'Filter…';
    if (inp.value !== state.panelQ) inp.value = state.panelQ;
  }

  $('#panelList').innerHTML = p.groups.map((g) => `
    ${g.label ? `<div class="panel-group">${esc(g.label)}</div>` : ''}
    ${g.items.map((it) => `<a class="panel-item ${it.id === item ? 'active' : ''}" href="#/${section}/${it.id}">
      ${it.dot ? `<span class="sdot" style="background:${it.dot}"></span>` : ''}
      <span class="pi-main"><span class="pi-t">${esc(it.title)}</span>${it.sub ? `<span class="pi-s" style="display:block">${esc(it.sub)}</span>` : ''}</span>
      ${it.right ? `<span class="pi-n">${esc(it.right)}</span>` : ''}
    </a>`).join('')}`).join('') ||
    `<div class="panel-empty">${state.panelQ ? 'Nothing matches that filter.'
      : (section === 'campaigns' || section === 'messages') ? 'No campaigns yet. Import a sheet or create one.' : 'Nothing here yet.'}</div>`;
}

function renderTabs(section, item, tab, tabs) {
  $('#tabbar').innerHTML = tabs.map(([id, label]) =>
    `<a class="tab ${id === tab ? 'active' : ''}" href="#/${section}/${item}/${id}">${esc(label)}</a>`).join('');
}

function updateSaveBadge() {
  const el = $('#saveBadge');
  if (!el) return;
  if (!persistState.on) {
    el.className = 'save-badge no-print off';
    el.innerHTML = '<i class="sdot"></i>Not saved — export before closing';
    el.title = 'This browser blocks local storage, so the workspace only lives in this tab.';
    return;
  }
  if (persistState.error) {
    el.className = 'save-badge no-print warn';
    el.innerHTML = '<i class="sdot"></i>Save failed';
    el.title = persistState.error;
    return;
  }
  const t = persistState.at ? persistState.at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
  if (SYNC.url && (SYNC.status === 'conflict' || SYNC.status === 'error')) {
    el.className = 'save-badge no-print warn';
    el.innerHTML = '<i class="sdot"></i>Sheet needs attention';
    el.title = SYNC.error || 'Open Setup → Google Sheet.';
    return;
  }
  el.className = 'save-badge no-print';
  el.innerHTML = SYNC.url
    ? `<i class="sdot"></i>${SYNC.status === 'syncing' ? 'Syncing…' : 'Sheet · saved ' + t}`
    : `<i class="sdot"></i>Saved ${t}`;
  el.title = SYNC.url
    ? `Saved in this browser and pushed to the shared Google Sheet${SYNC.at ? ' (last sync ' + SYNC.at.toLocaleString() + ')' : ''}.`
    : `Stored in this browser only (${Math.round(persistState.bytes / 1024)} KB). Export a JSON backup from Setup → Data sources.`;
}

function render() {
  recomputeCreatorStats();
  const { section, item, tab, tabs } = parseHash();
  if ($('#drawer').classList.contains('open') && !window.__keepDrawer) closeDrawer();

  renderRail(section);
  renderPanel(section, item);
  renderTabs(section, item, tab, tabs);
  $('#pageTitle').textContent = titleFor(section, item);
  const sectLabel = (SECTIONS.find((s) => s.id === section) || {}).label;
  $('#crumb').textContent = (section === 'campaigns' || section === 'messages') && byCampaign[item]
    ? sectLabel + ' · ' + byCampaign[item].name : sectLabel;

  const view = $('#view');
  view.innerHTML = '';
  if (section === 'campaigns')      renderCampaignSection(view, item, tab);
  else if (section === 'creators')  renderCreators(view, item, tab);
  else if (section === 'analytics') renderAnalytics(view, item, tab);
  else if (section === 'messages')  renderMessagesSection(view, item, tab);
  else if (section === 'contracts') renderContracts(view, item, tab);
  else if (section === 'settings')  renderSettings(view, item);
  else                              renderOverview(view, item, tab);
  window.scrollTo(0, 0);
  view.scrollTop = 0;
  persist();
  updateSaveBadge();
}

/* ------------------------------ theme ------------------------------ */
const THEME_KEY = 'vively-theme';
function readStoredTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
}
function storeTheme(t) {
  try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* private mode / sandbox — session only */ }
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const btn = $('#themeToggle');
  if (btn) {
    btn.textContent = t === 'light' ? '☀' : '☾';
    btn.title = t === 'light' ? 'Switch to dark (T)' : 'Switch to light (T)';
  }
}
function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
function toggleTheme() {
  const next = currentTheme() === 'light' ? 'dark' : 'light';
  applyTheme(next); storeTheme(next);
}
applyTheme(readStoredTheme() || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('#themeToggle').addEventListener('click', toggleTheme);

/* panel show / hide */
function togglePanel(force) {
  const closed = force != null ? !force : !document.body.classList.contains('panel-closed');
  document.body.classList.toggle('panel-closed', closed);
  document.body.classList.toggle('panel-open', !closed);
}
$('#panelToggle').addEventListener('click', () => togglePanel());
$('#panelHide').addEventListener('click', () => togglePanel(false));
$('#panelQ').addEventListener('input', (e) => {
  state.panelQ = e.target.value;
  const { section, item } = parseHash();
  renderPanel(section, item);
  $('#panelQ').focus();
});

/* global search */
function wireSearch() {
  const inp = $('#globalSearch');
  const box = document.createElement('div');
  box.className = 'ac-list';
  box.style.cssText = 'position:absolute;top:52px;right:24px;width:420px;';
  document.body.appendChild(box);

  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2) { box.classList.remove('open'); return; }
    const cs = selectable(DB.creators).filter((c) => (c.handle + c.name + c.categories.join('')).toLowerCase().includes(q)).slice(0, 6);
    const cps = DB.campaigns.filter((c) => (c.brand + c.name + c.kind).toLowerCase().includes(q)).slice(0, 5);
    box.innerHTML =
      (cps.length ? `<div class="ac-empty" style="padding:8px 12px 4px">Campaigns</div>` + cps.map((c) =>
        `<div class="ac-item" data-go="#/campaigns/${c.id}/roster"><div style="flex:1"><div style="font-size:13px;font-weight:500">${esc(c.brand)}</div><div style="font-size:11.5px;color:var(--text-3)">${esc(c.name)}</div></div>${statusPill(c.status)}</div>`).join('') : '') +
      (cs.length ? `<div class="ac-empty" style="padding:8px 12px 4px">Creators</div>` + cs.map((c) =>
        `<div class="ac-item" data-cr="${c.id}">${avatarHtml(c.handle)}<div style="flex:1"><div style="font-size:13px;font-weight:500">${esc(c.handle)} ${flagPill(c.flag)}</div><div style="font-size:11.5px;color:var(--text-3)">${kmb(c.followers)} · ${esc(c.country)}</div></div></div>`).join('') : '') ||
      `<div class="ac-empty">No matches.</div>`;
    box.classList.add('open');
    $$('.ac-item', box).forEach((it) => it.addEventListener('mousedown', () => {
      box.classList.remove('open'); inp.value = '';
      if (it.dataset.go) location.hash = it.dataset.go; else showCreator(it.dataset.cr);
    }));
  });
  inp.addEventListener('blur', () => setTimeout(() => box.classList.remove('open'), 160));
}

$('#drawerClose').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#globalSearch').focus(); }
  if (e.key === '[' && !typing) { e.preventDefault(); togglePanel(); }
  if ((e.key === 't' || e.key === 'T') && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleTheme(); }
});
$('#btnExportAll').addEventListener('click', () => {
  const rows = DB.campaigns.map((cp) => {
    const s = campaignStats(cp);
    return [cp.brand, cp.name, cp.kind, cp.status, cp.start, cp.end, cp.targetCreators, s.contacted, s.confirmed, s.delivered,
            s.views, s.reach, s.eng, (s.er * 100).toFixed(2) + '%', Math.round(s.spend), Math.round(s.cpm), s.cpv.toFixed(2), s.cpe.toFixed(2), s.viralCount];
  });
  downloadFile(toCsv(['brand','campaign','type','status','start','end','target','contacted','confirmed','delivered','views','reach','engagements','er','spend_krw','cpm','cpv','cpe','viral_posts'], rows),
    'vively-all-campaigns.csv', 'text/csv;charset=utf-8');
});

/* ------------------------------ auth ------------------------------ */
const authState = { mode: 'login', user: null };

function setAuthMode(mode) {
  authState.mode = mode === 'signup' ? 'signup' : 'login';
  $$('#authMode button').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.mode === authState.mode);
  });
  $('#loginForm').classList.toggle('active', authState.mode === 'login');
  $('#signupForm').classList.toggle('active', authState.mode === 'signup');
}

function openAuth(mode) {
  setAuthMode(mode || authState.mode);
  const ov = $('#authOverlay');
  ov.classList.add('open');
  ov.setAttribute('aria-hidden', 'false');
  (authState.mode === 'login' ? $('#loginEmail') : $('#signupName')).focus();
}

function closeAuth() {
  const ov = $('#authOverlay');
  ov.classList.remove('open');
  ov.setAttribute('aria-hidden', 'true');
}

async function sendAuth(path, payload) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'Auth request failed');
  return body;
}

function refreshAuthButtons() {
  const loginBtn = $('#btnLogin');
  const signupBtn = $('#btnSignup');
  if (!loginBtn || !signupBtn) return;
  if (authState.user) {
    loginBtn.textContent = 'Logout';
    signupBtn.textContent = authState.user.name || authState.user.email;
    signupBtn.disabled = true;
  } else {
    loginBtn.textContent = 'Login';
    signupBtn.textContent = 'Signup';
    signupBtn.disabled = false;
  }
}

$('#btnLogin').addEventListener('click', () => {
  if (authState.user) {
    authState.user = null;
    refreshAuthButtons();
    toast('Logged out');
    return;
  }
  openAuth('login');
});

$('#btnSignup').addEventListener('click', () => {
  if (!authState.user) openAuth('signup');
});

$('#authClose').addEventListener('click', closeAuth);
$('#authOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'authOverlay') closeAuth();
});

$$('#authMode button').forEach((btn) => {
  btn.addEventListener('click', () => setAuthMode(btn.dataset.mode));
});

$('#signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('#signupName').value.trim();
  const email = $('#signupEmail').value.trim().toLowerCase();
  const password = $('#signupPassword').value;
  const confirm = $('#signupConfirm').value;

  if (password.length < 8) return toast('Password minimal 8 karakter');
  if (password !== confirm) return toast('Konfirmasi password tidak sama');

  const btn = $('#signupSubmit');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Creating...';
  try {
    const data = await sendAuth('/api/signup', { name, email, password });
    authState.user = data.user;
    refreshAuthButtons();
    closeAuth();
    $('#signupForm').reset();
    toast('Signup berhasil. Welcome ' + authState.user.name);
  } catch (err) {
    toast(err.message || 'Signup gagal');
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
});

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#loginEmail').value.trim().toLowerCase();
  const password = $('#loginPassword').value;
  const btn = $('#loginSubmit');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Logging in...';
  try {
    const data = await sendAuth('/api/login', { email, password });
    authState.user = data.user;
    refreshAuthButtons();
    closeAuth();
    $('#loginForm').reset();
    toast('Login sukses. Hi ' + authState.user.name);
  } catch (err) {
    toast(err.message || 'Login gagal');
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
});

refreshAuthButtons();

window.addEventListener('hashchange', render);
window.addEventListener('beforeunload', () => persist(true));
persistState.on = storageAvailable();
loadPersisted();
loadSyncConfig();
loadContractDefaults();
lastPushedJson = JSON.stringify(DB);
wireSearch();
if (window.innerWidth <= 1080) togglePanel(false);
render();
</script>
