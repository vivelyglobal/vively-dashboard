<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIVELY — Creator Seeding Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VIVELY DASHBOARD — tokens
   Chart palette validated with the dataviz validator against
   the dark surface #17181a:
     lightness band PASS · chroma PASS · CVD adjacent PASS/WARN(7.9)
     normal-vision PASS (18.0) · contrast PASS (all >= 3:1)
   The one WARN pair (yellow<->green) ships with secondary
   encoding: legend + direct labels + table view + 2px gap.
   ============================================================ */
:root {
  color-scheme: dark;

  --bg:            #0e0f11;   /* page plane */
  --surface:       #17181a;   /* card / chart surface */
  --surface-2:     #1e2023;   /* raised: inputs, hover */
  --surface-3:     #26282c;   /* active / selected */
  --line:          rgba(255,255,255,0.09);
  --line-strong:   rgba(255,255,255,0.17);

  --text:          #e8eaed;
  --text-2:        #9aa0a6;
  --text-3:        #6f757c;

  /* Google-family highlight */
  --blue:          #4e8ef7;
  --blue-hi:       #8ab4f8;
  --blue-soft:     rgba(78,142,247,0.14);
  --blue-soft-2:   rgba(78,142,247,0.24);

  /* categorical series (fixed order — never cycled) */
  --s1: #4e8ef7;  --s2: #d96a08;  --s3: #1e9e6a;  --s4: #bd8300;
  --s5: #a06ee0;  --s6: #e5514a;  --s7: #00a0b0;

  /* status (reserved — never reused as a series) */
  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;

  --grid:     #2c2c2a;
  --axis:     #383835;
  --muted-ink:#898781;

  --rail-bg:     #0b0c0d;
  --tip-bg:      #26282c;
  --toast-bg:    #e8eaed;
  --toast-fg:    #17181a;
  --on-accent:   #08090c;
  --scroll-thumb:    #33363a;
  --scroll-thumb-hi: #45484d;
  --shadow: 0 6px 20px rgba(0,0,0,.5);

  --r:   8px;
  --r-lg:12px;
  --r-pill: 999px;
  --rail: 232px;
}

/* ---------------------------- light theme ----------------------------
   Series colours re-validated for the white surface:
     lightness PASS · chroma PASS · CVD adjacent PASS (9.1)
     normal-vision PASS (22.9) · contrast WARN on green + yellow, which
     the relief rule covers — every chart ships direct labels, a legend
     and a table view.
   -------------------------------------------------------------------- */
:root[data-theme="light"] {
  color-scheme: light;

  --bg:            #f8f9fa;
  --surface:       #ffffff;
  --surface-2:     #f1f3f4;
  --surface-3:     #e4e7ea;
  --line:          rgba(32,33,36,0.13);
  --line-strong:   rgba(32,33,36,0.26);

  --text:          #202124;
  --text-2:        #5f6368;
  --text-3:        #80868b;

  --blue:          #1a73e8;
  --blue-hi:       #1558b0;
  --blue-soft:     rgba(26,115,232,0.10);
  --blue-soft-2:   rgba(26,115,232,0.20);

  --s1: #1a73e8;  --s2: #e8710a;  --s3: #1baf7a;  --s4: #eda100;
  --s5: #a06ee0;  --s6: #c5221f;  --s7: #0097a7;

  --grid:     #e8eaed;
  --axis:     #dadce0;
  --muted-ink:#5f6368;

  --rail-bg:     #ffffff;
  --tip-bg:      #ffffff;
  --toast-bg:    #202124;
  --toast-fg:    #ffffff;
  --on-accent:   #ffffff;
  --scroll-thumb:    #c6c9cd;
  --scroll-thumb-hi: #aeb2b7;
  --shadow: 0 6px 20px rgba(60,64,67,.22);
}
:root[data-theme="light"] .stat .value { font-weight: 400; letter-spacing: -.015em; }
:root[data-theme="light"] .topbar h1 { font-weight: 400; }
:root[data-theme="light"] .pill.blue   { color: #1558b0; border-color: rgba(26,115,232,.4);  background: rgba(26,115,232,.09); }
:root[data-theme="light"] .pill.green  { color: #0b6b1f; border-color: rgba(12,163,12,.42);  background: rgba(12,163,12,.10); }
:root[data-theme="light"] .pill.yellow { color: #8a5a00; border-color: rgba(234,161,0,.45);  background: rgba(234,161,0,.13); }
:root[data-theme="light"] .pill.orange { color: #a4441c; border-color: rgba(236,131,90,.45); background: rgba(236,131,90,.13); }
:root[data-theme="light"] .pill.red    { color: #a50e0e; border-color: rgba(197,34,31,.4);   background: rgba(197,34,31,.09); }
:root[data-theme="light"] .pill.purple { color: #6027ad; border-color: rgba(160,110,224,.45);background: rgba(160,110,224,.12); }
:root[data-theme="light"] .pill.grey   { color: var(--text-2); }
:root[data-theme="light"] .delta.up    { color: #0b6b1f; }
:root[data-theme="light"] .delta.down  { color: #a50e0e; }
:root[data-theme="light"] .brand .mark { color: #ffffff; }
:root[data-theme="light"] .tip         { box-shadow: var(--shadow); }
:root[data-theme="light"] .ac-list     { box-shadow: var(--shadow); }
:root[data-theme="light"] .alert-row .ai { color: #ffffff; }
:root[data-theme="light"] tr.blocked-row td { opacity: .6; }

.tip { box-shadow: var(--shadow); }

/* document preview */
.doc-scroll { max-height: calc(100vh - 210px); overflow-y: auto; padding: 0 18px 18px; }
.doc-page {
  background: #ffffff; color: #1a1a1a; border: 1px solid var(--line); border-radius: 6px;
  padding: 34px 38px; font-family: Calibri, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  font-size: 12.5px; line-height: 1.65;
}
.doc-page.wide { max-width: 900px; margin: 0 auto; padding: 52px 62px; }
.doc-page .doc-h1 { font-size: 17px; font-weight: 700; text-align: center; margin: 0 0 6px; letter-spacing: .01em; }
.doc-page .doc-sub { font-size: 12px; color: #555; text-align: center; margin: 0 0 18px; }
.doc-page .doc-h2 { font-size: 13px; font-weight: 700; margin: 18px 0 6px; }
.doc-page .doc-h3 { font-size: 12.5px; font-weight: 700; margin: 12px 0 4px; }
.doc-page .doc-p { margin: 0 0 8px; }
.doc-page .doc-p.b { font-weight: 700; }
.doc-page .doc-break { border-top: 1px dashed #bbb; margin: 26px 0; }
.doc-page .doc-table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 11.5px; }
.doc-page .doc-table td, .doc-page .doc-table th {
  border: 1px solid #c9c9c9; padding: 7px 9px; vertical-align: top; text-align: left; color: #1a1a1a;
}
.doc-page .doc-table th { background: #f2f2f2; font-weight: 700; }

/* save indicator */
.save-badge {
  font-size: 11.5px; color: var(--text-3); white-space: nowrap; display: inline-flex;
  align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill);
  background: var(--surface-2); cursor: default;
}
.save-badge .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
.save-badge.warn { color: #f5c451; }
.save-badge.warn .sdot { background: var(--warning); }
.save-badge.off .sdot { background: var(--text-3); }
@media (max-width: 1240px) { .save-badge { display: none; } }

/* theme switch */
.theme-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-strong);
  background: transparent; color: var(--text-2); cursor: pointer; font-size: 14px;
  display: grid; place-items: center; flex-shrink: 0;
}
.theme-btn:hover { background: var(--surface-2); color: var(--text); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue-hi); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--blue-soft-2); }

/* scrollbars — GA-ish thin */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hi); background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* ============================ layout ============================ */
/* three layers: icon rail (what) -> side menu (which) -> tabbed content (view of it) */
.app { display: grid; grid-template-columns: 76px var(--panelw) 1fr; min-height: 100vh; }
body { --panelw: 268px; }
body.panel-closed { --panelw: 0px; }

.rail {
  background: var(--rail-bg); border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; align-items: center; padding-bottom: 20px;
}
.rail::-webkit-scrollbar { width: 0; }
.brand {
  height: 64px; display: grid; place-items: center; width: 100%; flex-shrink: 0;
}
.brand .mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--blue) 0%, #a06ee0 100%);
  display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #06070a;
}
.rail-item {
  width: 60px; padding: 9px 2px 7px; margin: 3px 0; border: 0; background: none; cursor: pointer;
  border-radius: 10px; color: var(--text-3); display: flex; flex-direction: column; align-items: center; gap: 4px;
  text-decoration: none; position: relative;
}
.rail-item:hover { background: var(--surface-2); color: var(--text-2); text-decoration: none; }
.rail-item.active { background: var(--blue-soft); color: var(--blue-hi); }
.rail-item .ico { font-size: 17px; line-height: 1; }
.rail-item .lb { font-size: 9.5px; letter-spacing: .02em; text-align: center; line-height: 1.15; }
.rail-item .dotb {
  position: absolute; top: 2px; right: 4px; min-width: 15px; height: 15px; border-radius: 99px;
  background: var(--surface-3); color: var(--text-2); font-size: 9px; display: grid; place-items: center; padding: 0 4px;
}
.rail-item.active .dotb { background: var(--blue-soft-2); color: var(--blue-hi); }
.rail-sep { width: 34px; height: 1px; background: var(--line); margin: 8px 0; }

.panel {
  background: var(--bg); border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh; overflow: hidden;
  display: flex; flex-direction: column; min-width: 0;
}
body.panel-closed .panel { border-right: 0; }
.panel-head {
  height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 18px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.panel-head .pt { font-size: 14px; font-weight: 500; letter-spacing: .01em; flex: 1; overflow: hidden; text-overflow: ellipsis; }
.panel-search { padding: 10px 12px 6px; flex-shrink: 0; }
.panel-search input { padding: 7px 11px; font-size: 12.5px; border-radius: var(--r-pill); }
.panel-list { overflow-y: auto; padding: 6px 8px 24px; flex: 1; }
.panel-group {
  font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3);
  padding: 12px 10px 5px; font-weight: 500;
}
.panel-item {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 8px 10px; margin: 1px 0; border: 0; background: none; cursor: pointer;
  border-radius: 8px; color: var(--text-2); font-size: 13px; text-decoration: none; min-width: 0;
}
.panel-item:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.panel-item.active { background: var(--surface-3); color: var(--text); }
.panel-item .pi-main { min-width: 0; flex: 1; }
.panel-item .pi-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
.panel-item.active .pi-t { font-weight: 500; }
.panel-item .pi-s { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-item .pi-n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.panel-item .sdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.panel-empty { padding: 20px 12px; font-size: 12.5px; color: var(--text-3); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  padding: 0 20px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 30;
}
.topbar h1 { font-size: 18px; font-weight: 400; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.topbar .crumb { font-size: 11.5px; color: var(--text-3); }
.topbar .spacer { flex: 1; }

.tabbar {
  display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--line);
  position: sticky; top: 64px; background: var(--bg); z-index: 29; overflow-x: auto; flex-shrink: 0;
}
.tabbar::-webkit-scrollbar { height: 0; }
.tabbar:empty { display: none; }

.searchbox {
  display: flex; align-items: center; gap: 8px; background: var(--surface-2);
  border: 1px solid transparent; border-radius: var(--r-pill); padding: 7px 14px; min-width: 230px;
}
.searchbox:focus-within { border-color: var(--blue); background: var(--surface); }
.searchbox input { background: none; border: 0; outline: 0; color: var(--text); font-size: 13.5px; width: 100%; }
.searchbox .ico { color: var(--text-3); font-size: 14px; }

.content { padding: 20px; flex: 1; min-width: 0; }

/* ============================ atoms ============================ */
.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  border: 1px solid var(--line-strong); background: transparent; color: var(--text);
  font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: var(--r-pill);
  cursor: pointer; transition: background .12s ease, border-color .12s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; color: var(--blue-hi); }
.btn.ghost:hover { background: var(--blue-soft); }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn.xs { padding: 3px 9px; font-size: 11.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.auth-actions { display: inline-flex; align-items: center; gap: 8px; }

.auth-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.56);
  display: none; align-items: center; justify-content: center;
  z-index: 280; padding: 20px;
}
.auth-overlay.open { display: flex; }

.auth-modal {
  width: min(500px, 100%); background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px;
}
.auth-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.auth-head h3 { margin: 0; font-size: 17px; font-weight: 500; }
.auth-close { margin-left: auto; }
.auth-sub { margin: 0 0 14px; color: var(--text-3); font-size: 12.5px; }
.auth-form { display: none; margin-top: 14px; }
.auth-form.active { display: block; }
.auth-row { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0,1fr)); }
.auth-note { margin: 8px 0 0; color: var(--text-3); font-size: 11.5px; }

@media (max-width: 640px) {
  .auth-row { grid-template-columns: 1fr; }
  .auth-actions { display: none; }
}

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 20px;
}
.card.tight { padding: 14px 16px; }
.card-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
}
.card-head h3 { font-size: 14px; font-weight: 500; margin: 0; letter-spacing: .01em; }
.card-head .sp { flex: 1; }
.card-sub { font-size: 12px; color: var(--text-3); margin: 0 0 14px; }

.grid { display: grid; gap: 16px; align-items: start; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0,1fr)); }
.g-2-1 { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
.g-1-2 { grid-template-columns: minmax(0,1fr) minmax(0,2fr); }

.sec-title {
  font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3);
  font-weight: 500; margin: 28px 0 12px;
}
.sec-title:first-child { margin-top: 0; }

/* stat tile */
.card.stat { align-self: stretch; }
.stat .label { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.stat .value {
  font-size: 30px; font-weight: 300; letter-spacing: -.02em; margin: 6px 0 2px; line-height: 1.1;
}
.stat .delta { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.delta.up   { color: var(--good); }
.delta.down { color: var(--critical); }
.delta.flat { color: var(--text-3); }
.stat .foot { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }

.pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500;
  padding: 2px 9px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); color: var(--text-2);
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.blue   { color: var(--blue-hi);  border-color: rgba(78,142,247,.4);  background: rgba(78,142,247,.10); }
.pill.green  { color: #6fce6f;         border-color: rgba(12,163,12,.45);  background: rgba(12,163,12,.12); }
.pill.yellow { color: #f5c451;         border-color: rgba(250,178,25,.42); background: rgba(250,178,25,.11); }
.pill.orange { color: #f0a077;         border-color: rgba(236,131,90,.42); background: rgba(236,131,90,.11); }
.pill.red    { color: #f08a8a;         border-color: rgba(208,59,59,.45);  background: rgba(208,59,59,.13); }
.pill.grey   { color: var(--text-2);   border-color: var(--line-strong);   background: var(--surface-2); }
.pill.purple { color: #c3a4ec;         border-color: rgba(160,110,224,.42);background: rgba(160,110,224,.12); }

.tag {
  display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 5px;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line);
}

/* tabs */
.tab {
  background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  color: var(--text-2); font-size: 13px; font-weight: 500; padding: 13px 16px; cursor: pointer;
  white-space: nowrap; text-decoration: none; display: inline-block;
}
.tab:hover { color: var(--text); text-decoration: none; }
.tab.active { color: var(--blue-hi); border-bottom-color: var(--blue); }

/* table */
.tbl-wrap { overflow-x: auto; border-radius: var(--r-lg); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th {
  text-align: left; font-size: 11.5px; font-weight: 500; color: var(--text-3);
  letter-spacing: .04em; text-transform: uppercase; padding: 10px 12px;
  border-bottom: 1px solid var(--line-strong); white-space: nowrap; background: var(--surface);
  position: sticky; top: 0; z-index: 2;
}
table.tbl th.num, table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl tbody tr.clickable { cursor: pointer; }
table.tbl td.strong { font-weight: 500; color: var(--text); }
table.tbl .sortable { cursor: pointer; user-select: none; }
table.tbl .sortable:hover { color: var(--text); }
table.tbl .sort-ind { color: var(--blue-hi); font-size: 9px; }

/* form controls */
.field { margin-bottom: 14px; }
.field > label, .lbl {
  display: block; font-size: 11.5px; font-weight: 500; color: var(--text-2);
  letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px;
}
input[type=text], input[type=password], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r); padding: 9px 12px; color: var(--text); font-size: 13.5px; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); background: var(--surface); }
textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
select { cursor: pointer; }
option { background: var(--surface-2); }
input[type=checkbox] { accent-color: var(--blue); width: 15px; height: 15px; cursor: pointer; }
.inline-fields { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.inline-fields .field { margin-bottom: 0; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: none; color: var(--text-2); font-size: 12.5px; font-weight: 500;
  padding: 5px 14px; border-radius: var(--r-pill); cursor: pointer;
}
.seg button.active { background: var(--surface-3); color: var(--text); }

<script>
"use strict";
/* ============================================================
   DATA LAYER — starts empty.
   Campaigns arrive either from the New campaign form or from an
   Excel import; creators arrive with them, or via CSV import.
   Everything lives in memory for the session — export the
   workspace JSON from Setup → Data sources to keep a copy.
   ============================================================ */

/* small deterministic helpers still used for ids and demo curves */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const RNG = mulberry32(20260819);
const rnd = () => RNG();
const ri  = (a, b) => Math.floor(a + RNG() * (b - a + 1));
const rf  = (a, b) => a + RNG() * (b - a);

const TODAY = new Date(new Date().toISOString().slice(0, 10) + 'T00:00:00Z');
const DAY = 86400000;
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const iso = (d) => d.toISOString().slice(0, 10);
const dLabel = (d) => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

/* ---------------- pipeline model ---------------- */
const STAGES = [
  { id: 'sourced',    label: 'Sourced',         color: 'var(--s7)', desc: 'Pulled from Instagram, ScoutLab or the in-house database' },
  { id: 'contacted',  label: 'Contacted',       color: 'var(--s1)', desc: 'First outreach DM sent' },
  { id: 'replied',    label: 'Replied',         color: 'var(--s5)', desc: 'Creator answered, negotiating' },
  { id: 'shortlisted',label: 'Shortlisted',     color: 'var(--s4)', desc: 'Sent to the brand for approval' },
  { id: 'confirmed',  label: 'Confirmed',       color: 'var(--s3)', desc: 'Participation agreed' },
  { id: 'shipped',    label: 'Shipped / Booked',color: 'var(--s2)', desc: 'Product dispatched or store visit scheduled' },
  { id: 'submitted',  label: 'Content in',      color: 'var(--s5)', desc: 'Draft received, awaiting review' },
  { id: 'review',     label: 'In review',       color: 'var(--s4)', desc: 'Brand / VIVELY review, revisions possible' },
  { id: 'live',       label: 'Live',            color: 'var(--s3)', desc: 'Published and tracking' },
  { id: 'dropped',    label: 'Dropped',         color: 'var(--s6)', desc: 'Declined, ghosted or removed' }
];
const STAGE_IDX = Object.fromEntries(STAGES.map((s, i) => [s.id, i]));
const stageOf = (id) => STAGES.find((s) => s.id === id) || STAGES[0];

const CAMPAIGN_STATUS = {
  planning:  { label: 'Planning',   cls: 'grey'   },
  outreach:  { label: 'Outreach',   cls: 'blue'   },
  confirming:{ label: 'Confirming', cls: 'purple' },
  production:{ label: 'Production', cls: 'yellow' },
  live:      { label: 'Live',       cls: 'green'  },
  wrapped:   { label: 'Wrapped',    cls: 'grey'   }
};

/* ---------------- vocab ---------------- */
const CATEGORIES = ['Beauty', 'Skincare', 'K-Food', 'Fashion', 'Lifestyle', 'Travel', 'Fitness', 'Cafe & Dining', 'Tech', 'Baby & Kids'];
const COUNTRIES  = ['Korea', 'Vietnam', 'Singapore', 'Thailand', 'Indonesia', 'Malaysia', 'Japan', 'Taiwan', 'Philippines', 'USA'];
const PLATFORMS  = ['Instagram', 'TikTok', 'YouTube'];
const SOURCES    = ['Instagram DM', 'ScoutLab', 'VIVELY database', 'Referral', 'Inbound form', 'Excel import', 'Imported CSV'];
const CONTENT_FORMATS = ['Reel', 'Carousel', 'TikTok video', 'Shorts', 'Story set'];

function tierOf(followers) {
  if (followers < 15000)  return { id: 'nano',  label: 'Nano',  cls: 'grey'   };
  if (followers < 60000)  return { id: 'micro', label: 'Micro', cls: 'blue'   };
  if (followers < 250000) return { id: 'mid',   label: 'Mid',   cls: 'purple' };
  return                         { id: 'macro', label: 'Macro', cls: 'yellow' };
}

const AV_COLORS = ['#4e8ef7', '#d96a08', '#1e9e6a', '#bd8300', '#a06ee0', '#e5514a', '#00a0b0'];
const avColor = (s) => {
  let h = 0; for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
};
const initials = (s) => String(s).replace(/^@/, '').slice(0, 2).toUpperCase();

/* front-loaded view curve, used when a post is approved and starts tracking */
function viewCurve(total, days, boosted) {
  const w = [];
  for (let i = 0; i < days; i++) {
    let v = Math.pow(0.72, i) + 0.02;
    if (boosted && i >= 3 && i <= 7) v += 0.35 * Math.pow(0.8, i - 3);
    w.push(v);
  }
  const sum = w.reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  return w.map((x) => { acc += (x / sum) * total; return Math.round(acc); });
}

/* ---------------- the workspace ---------------- */
const DB = { creators: [], campaigns: [], participants: [] };
const byCreator = {};
const byCampaign = {};

/* ------------------------------------------------------------------
   Persistence. The whole workspace is saved to this browser's local
   storage after every change, so a refresh or a closed tab does not
   lose anything. It is per-browser and per-device — not shared, and
   not a server. Use Export workspace (JSON) for a real backup.
   ------------------------------------------------------------------ */
const STORE_KEY = 'vively-workspace-v1';
let persistState = { on: false, at: null, bytes: 0, error: null };
let persistTimer = null;

function storageAvailable() {
  try { localStorage.setItem('__v', '1'); localStorage.removeItem('__v'); return true; }
  catch (e) { return false; }
}

function persist(now) {
  if (!persistState.on) return;
  clearTimeout(persistTimer);
  const write = () => {
    try {
      const json = JSON.stringify({ savedAt: new Date().toISOString(), db: DB, settings: SETTINGS });
      localStorage.setItem(STORE_KEY, json);
      persistState.at = new Date();
      persistState.bytes = json.length;
      persistState.error = null;
      if (typeof scheduleSheetPush === 'function') scheduleSheetPush(JSON.stringify(DB));
    } catch (e) {
      persistState.error = /quota/i.test(e.name + e.message)
        ? 'Browser storage is full — export the workspace and clear old campaigns.'
        : e.message;
    }
    updateSaveBadge();
  };
  if (now) write(); else persistTimer = setTimeout(write, 600);
}

function loadPersisted() {
  if (!persistState.on) return false;
  let raw;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  try {
    const saved = JSON.parse(raw);
    const db = saved.db || saved;
    if (!db || !Array.isArray(db.creators)) return false;
    DB.creators = db.creators || [];
    DB.campaigns = db.campaigns || [];
    DB.participants = db.participants || [];
    DB.creators.forEach((c) => (byCreator[c.id] = c));
    DB.campaigns.forEach((c) => (byCampaign[c.id] = c));
    if (saved.settings && typeof saved.settings.hideBlocked === 'boolean') SETTINGS.hideBlocked = saved.settings.hideBlocked;
    persistState.at = saved.savedAt ? new Date(saved.savedAt) : null;
    persistState.bytes = raw.length;
    return true;
  } catch (e) { return false; }
}

function clearPersisted() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nothing to clear */ }
  DB.creators.length = 0; DB.campaigns.length = 0; DB.participants.length = 0;
  Object.keys(byCreator).forEach((k) => delete byCreator[k]);
  Object.keys(byCampaign).forEach((k) => delete byCampaign[k]);
  persistState.at = null; persistState.bytes = 0; persistState.error = null;
}

/* ------------------------------------------------------------------
   One creator, one row. Handles arrive from spreadsheets in every
   shape — trailing dots, query strings, mixed case — so matching is
   done on a normalised form. Campaigns may of course repeat the same
   creator; the database may not.
   ------------------------------------------------------------------ */
/* One creator, one row. Handles arrive in every shape a person can type them \u2014
   @name, NAME, name/, instagram.com/name/?hl=ko, a full https URL pasted out of
   the browser bar \u2014 and all of those are the same creator. */
function normHandle(h) {
  let s = String(h || '').trim().toLowerCase()
    .replace(/[\s\u200b]/g, '')
    .replace(/[?#].*$/, '');
  /* pull the handle out of a profile URL, whatever platform */
  const m = s.match(/^(?:https?:)?\/\/?(?:www\.)?(?:instagram|tiktok|youtube)\.com\/(?:@)?([^/]+)/);
  if (m) s = m[1];
  return s.replace(/^@+/, '').replace(/\/+$/, '').replace(/\.+$/, '');
}
function findCreatorByHandle(handle) {
  const k = normHandle(handle);
  return k ? DB.creators.find((c) => normHandle(c.handle) === k) : null;
}

/* group the database by normalised handle and report anything doubled up */
function duplicateCreatorGroups() {
  const groups = {};
  DB.creators.forEach((c) => {
    const k = normHandle(c.handle);
    if (!k) return;
    (groups[k] = groups[k] || []).push(c);
  });
  return Object.entries(groups).filter(([, list]) => list.length > 1)
    .map(([key, list]) => ({ key, list }));
}

const richness = (c) => (c.campaignIds || []).length * 100 + (c.followers ? 10 : 0) +
  (c.email ? 2 : 0) + (c.contact ? 2 : 0) + (c.address ? 2 : 0) + (c.flag ? 5 : 0) + (c.notes ? 1 : 0);

function mergeDuplicateCreators() {
  const groups = duplicateCreatorGroups();
  let mergedCreators = 0, mergedParticipants = 0;

  groups.forEach(({ list }) => {
    const ordered = list.slice().sort((a, b) => richness(b) - richness(a));
    const keep = ordered[0];
    const drop = ordered.slice(1);

    drop.forEach((d) => {
      /* fill anything blank on the survivor from the duplicate */
      ['name', 'platform', 'country', 'nationality', 'email', 'contact', 'address', 'source', 'lastWorked'].forEach((k) => {
        if (!keep[k] && d[k]) keep[k] = d[k];
      });
      ['followers', 'er', 'avgViews', 'rate', 'reliability', 'avgTurnaroundDays'].forEach((k) => {
        if (!keep[k] && d[k]) keep[k] = d[k];
      });
      keep.categories = [...new Set([...(keep.categories || []), ...(d.categories || [])])];
      keep.languages = [...new Set([...(keep.languages || []), ...(d.languages || [])])];
      keep.tags = [...new Set([...(keep.tags || []), ...(d.tags || [])])];
      if (d.notes && !String(keep.notes || '').includes(d.notes)) keep.notes = [keep.notes, d.notes].filter(Boolean).join('\n');
      /* a blacklist flag always wins over no flag */
      const rank = { blocked: 3, caution: 2, preferred: 1 };
      if (d.flag && (rank[d.flag] || 0) > (rank[keep.flag] || 0)) {
        keep.flag = d.flag; keep.flagReason = d.flagReason; keep.flagAt = d.flagAt;
      }
      keep.tier = tierOf(keep.followers || 0).id;

      /* move every campaign row across to the survivor */
      DB.participants.forEach((p) => { if (p.creatorId === d.id) p.creatorId = keep.id; });
      delete byCreator[d.id];
      mergedCreators++;
    });
  });

  /* one row per creator per campaign — keep whichever got furthest */
  const seen = {};
  const keptRows = [];
  DB.participants.forEach((p) => {
    const k = p.campaignId + '::' + p.creatorId;
    const prev = seen[k];
    if (!prev) { seen[k] = p; keptRows.push(p); return; }
    const better = (STAGE_IDX[p.stage] > STAGE_IDX[prev.stage]) || (p.content && !prev.content);
    if (better) {
      Object.keys(prev).forEach((key) => { if (!prev[key] && p[key]) prev[key] = p[key]; });
      Object.assign(prev, p);
    } else {
      Object.keys(p).forEach((key) => { if (!prev[key] && p[key]) prev[key] = p[key]; });
    }
    mergedParticipants++;
  });
  DB.participants = keptRows;
  DB.participants.forEach((p) => { p.id = p.campaignId + '-' + p.creatorId; });

  const keepIds = new Set(Object.keys(byCreator));
  DB.creators = DB.creators.filter((c) => keepIds.has(c.id));
  recomputeCreatorStats();
  return { mergedCreators, mergedParticipants, groups: groups.length };
}

/* derived creator stats — recomputed whenever the roster changes */
function recomputeCreatorStats() {
  const byId = {};
  DB.participants.forEach((p) => (byId[p.creatorId] = byId[p.creatorId] || []).push(p));
  DB.creators.forEach((cr) => {
    const ps = byId[cr.id] || [];
    const live = ps.filter((p) => p.content && p.stage === 'live');
    cr.campaignIds = [...new Set(ps.map((p) => p.campaignId))];
    cr.contentCount = live.length;
    cr.campaignsDone = live.length;
    cr.totalViews = live.reduce((a, p) => a + (p.content.views || 0), 0);
    cr.bestViews = live.reduce((a, p) => Math.max(a, p.content.views || 0), 0);
    const confirmed = ps.filter((p) => p.stage !== 'dropped' && STAGE_IDX[p.stage] >= 4).length;
    cr.deliveredRate = confirmed ? live.length / confirmed : 0;
    const posted = live.map((p) => p.content.postedAt).filter(Boolean).sort().pop();
    if (posted) cr.lastWorked = posted;
  });
}
/* ============================================================
   METRICS
   ============================================================ */
const nf  = new Intl.NumberFormat('en-US');
const num = (v) => nf.format(Math.round(v || 0));
const kmb = (v) => {
  v = v || 0;
  if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(v >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return String(Math.round(v));
};
const pct = (v, d = 1) => (v * 100).toFixed(d) + '%';
const won = (v) => '₩' + nf.format(Math.round(v || 0));
const wonK = (v) => {
  v = v || 0;
  if (v >= 1e8) return '₩' + (v / 1e8).toFixed(2).replace(/\.00$/, '') + '억';
  if (v >= 1e4) return '₩' + nf.format(Math.round(v / 1e4)) + '만';
  return '₩' + nf.format(Math.round(v));
};
const money2 = (v) => '₩' + (v >= 100 ? nf.format(Math.round(v)) : v.toFixed(1));

const engagementsOf = (c) => c ? (c.likes + c.comments + c.shares + c.saves) : 0;

function partsOf(campaignId) { return DB.participants.filter((p) => p.campaignId === campaignId); }
function liveOf(campaignId)  { return partsOf(campaignId).filter((p) => p.stage === 'live' && p.content); }

/* viral score: how far a post beat the creator's own baseline, weighted by
   share+save rate. 1.0 = on par with baseline. */
function viralScore(p) {
  const cr = byCreator[p.creatorId];
  if (!p.content || !cr || !cr.avgViews) return 0;
  const lift = p.content.views / cr.avgViews;
  const sr = p.content.views ? (p.content.shares + p.content.saves) / p.content.views : 0;
  return +(lift * (1 + sr * 6)).toFixed(2);
}

function campaignSpend(cp) {
  const ps = partsOf(cp.id);
  const shipped = ps.filter((p) => STAGE_IDX[p.stage] >= 5 && p.stage !== 'dropped').length;
  const fees = ps.reduce((a, p) => a + (STAGE_IDX[p.stage] >= 4 && p.stage !== 'dropped' ? p.fee : 0), 0);
  return shipped * cp.productCostPer + fees + cp.adSpend;
}

function campaignStats(cp) {
  const ps = partsOf(cp.id);
  const live = ps.filter((p) => p.stage === 'live' && p.content);
  const views = live.reduce((a, p) => a + p.content.views, 0);
  const paid  = live.reduce((a, p) => a + p.content.paidViews, 0);
  const reach = live.reduce((a, p) => a + p.content.reach, 0);
  const eng   = live.reduce((a, p) => a + engagementsOf(p.content), 0);
  const comments = live.reduce((a, p) => a + p.content.comments, 0);
  const spend = campaignSpend(cp);
  const contacted = ps.filter((p) => STAGE_IDX[p.stage] >= 1 && p.stage !== 'dropped').length
                  + ps.filter((p) => p.stage === 'dropped' && p.contactedAt).length;
  const confirmed = ps.filter((p) => STAGE_IDX[p.stage] >= 4 && p.stage !== 'dropped').length;
  return {
    total: ps.length, contacted, confirmed,
    delivered: live.length,
    views, paidViews: paid, organicViews: views - paid, reach, eng, comments,
    er: views ? eng / views : 0,
    spend,
    cpm: reach ? spend / reach * 1000 : 0,
    cpv: views ? spend / views : 0,
    cpe: eng ? spend / eng : 0,
    cpi: confirmed ? spend / confirmed : 0,          // cost per influencer
    replyRate: contacted ? ps.filter((p) => p.repliedAt).length / contacted : 0,
    confirmRate: contacted ? confirmed / contacted : 0,
    deliveryRate: confirmed ? live.length / confirmed : 0,
    progress: cp.targetCreators ? Math.min(1, confirmed / cp.targetCreators) : 0,
    viralCount: live.filter((p) => viralScore(p) >= 3).length
  };
}

function portfolioStats(campaigns) {
  const acc = { views: 0, paidViews: 0, reach: 0, eng: 0, comments: 0, spend: 0, delivered: 0, confirmed: 0, contacted: 0, viralCount: 0 };
  campaigns.forEach((cp) => {
    const s = campaignStats(cp);
    acc.views += s.views; acc.paidViews += s.paidViews; acc.reach += s.reach;
    acc.eng += s.eng; acc.comments += s.comments; acc.spend += s.spend;
    acc.delivered += s.delivered; acc.confirmed += s.confirmed; acc.contacted += s.contacted;
    acc.viralCount += s.viralCount;
  });
  acc.organicViews = acc.views - acc.paidViews;
  acc.er  = acc.views ? acc.eng / acc.views : 0;
  acc.cpm = acc.reach ? acc.spend / acc.reach * 1000 : 0;
  acc.cpv = acc.views ? acc.spend / acc.views : 0;
  acc.cpe = acc.eng ? acc.spend / acc.eng : 0;
  acc.cpi = acc.confirmed ? acc.spend / acc.confirmed : 0;
  return acc;
}

/* daily aggregate views across a set of campaigns, last N days */
function dailySeries(campaigns, days) {
  const out = new Array(days).fill(0);
  const outEng = new Array(days).fill(0);
  campaigns.forEach((cp) => liveOf(cp.id).forEach((p) => {
    const c = p.content;
    const posted = new Date(c.postedAt + 'T00:00:00Z');
    const startIdx = days - 1 - Math.round((TODAY - posted) / DAY);
    let prev = 0;
    c.curve.forEach((cum, i) => {
      const inc = cum - prev; prev = cum;
      const idx = startIdx + i;
      if (idx >= 0 && idx < days) {
        out[idx] += inc;
        outEng[idx] += inc * (engagementsOf(c) / (c.views || 1));
      }
    });
  }));
  const labels = [];
  for (let i = days - 1; i >= 0; i--) labels.push(iso(addDays(TODAY, -i)));
  return { labels, views: out, eng: outEng.map((v) => Math.round(v)) };
}

function funnelOf(campaignIds) {
  const ps = DB.participants.filter((p) => campaignIds.includes(p.campaignId));
  const active = ps.filter((p) => p.stage !== 'dropped');
  const counts = STAGES.filter((s) => s.id !== 'dropped').map((s) => ({
    stage: s,
    n: active.filter((p) => STAGE_IDX[p.stage] >= STAGE_IDX[s.id]).length
  }));
  return { counts, dropped: ps.length - active.length, total: ps.length };
}

/* blacklist / preference flags feed both suggestions and search */
const SETTINGS = { hideBlocked: true };
const isBlocked = (cr) => cr.flag === 'blocked';
function selectable(list) { return SETTINGS.hideBlocked ? list.filter((c) => !isBlocked(c)) : list; }

/* auto-suggest scoring: how well a creator fits a campaign */
function suggestScore(cr, cp) {
  let s = 0;
  const reasons = [];
  if (cr.flag === 'blocked') return { score: 0, blocked: true, reasons: ['blacklisted'] };
  if (cr.flag === 'preferred') { s += 12; reasons.push('preferred creator'); }
  if (cr.flag === 'caution') { s -= 20; reasons.push('flagged — caution'); }
  if (cr.categories.includes(cp.category)) { s += 28; reasons.push('category match'); }
  else if (cr.categories.some((c) => ['Beauty', 'Skincare'].includes(c) && ['Beauty', 'Skincare'].includes(cp.category))) { s += 14; reasons.push('adjacent category'); }
  if (cr.country === cp.market) { s += 16; reasons.push('in target market'); }
  if (cr.followers >= cp.minFollowers) { s += 10; } else { s -= 25; reasons.push('below min followers'); }
  if (cp.platforms.includes(cr.platform)) { s += 10; reasons.push(cr.platform); }
  if (cr.er >= 4) { s += 8; reasons.push('ER ' + cr.er + '%'); }
  if (cr.reliability >= 4.3) { s += 12; reasons.push('reliable (' + cr.reliability + ')'); }
  if (cr.campaignsDone >= 2) { s += 8; reasons.push(cr.campaignsDone + ' past campaigns'); }
  if (cr.lastWorked && (TODAY - new Date(cr.lastWorked)) / DAY < 45) { s -= 14; reasons.push('worked recently'); }
  if (cr.tags.includes('needs reminders')) { s -= 6; }
  return { score: Math.max(0, Math.min(100, Math.round(s + 8))), reasons: reasons.slice(0, 3) };
}
/* ============================================================
   CHARTS — hand-rolled SVG. Rules from the dataviz skill:
   one axis only, thin marks, recessive grid, legend for >=2
   series, direct end-labels for <=4 series, hover crosshair +
   tooltip everywhere, and a table view behind every chart.
   ============================================================ */
const SERIES_COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)'];
/* both lists are CSS variables, so a theme switch repaints every chart
   without re-rendering anything */
const SERIES_HEX    = SERIES_COLORS;

function hexOf(series, i) { return series.color || SERIES_COLORS[i % 7]; }

/* fill the space that's actually left below the KPI row */
function fitHeight(offset, min) {
  return Math.max(min || 200, Math.min(560, window.innerHeight - (offset || 400)));
}

function niceTicks(max, count = 4) {
  if (max <= 0) return [0, 1];
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}

function el(tag, attrs, kids) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
  (kids || []).forEach((c) => n.appendChild(c));
  return n;
}

function tableFallback(headers, rows) {
  const d = document.createElement('details');
  d.style.marginTop = '10px';
  const s = document.createElement('summary');
  s.textContent = 'View as table';
  s.style.cssText = 'font-size:12px;color:var(--text-3);cursor:pointer;list-style:none;';
  d.appendChild(s);
  const w = document.createElement('div');
  w.className = 'tbl-wrap';
  w.style.marginTop = '10px';
  w.innerHTML = `<table class="tbl"><thead><tr>${headers.map((h, i) => `<th${i ? ' class="num"' : ''}>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td${i ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  d.appendChild(w);
  return d;
}

/* ------------------------------ line chart ------------------------------ */
function lineChart(mount, opt) {
  const { labels, series } = opt;
  const H = opt.height || 220, padL = opt.padL || 46, padR = opt.padR || (series.length <= 4 ? 56 : 12), padT = 12, padB = 26;
  const W = 900; // viewBox width; svg is width:100%
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const fmt = opt.format || kmb;

  const maxV = Math.max(1, ...series.flatMap((s) => s.values));
  const ticks = niceTicks(maxV, 4);
  const top = ticks[ticks.length - 1];
  const x = (i) => padL + (labels.length === 1 ? innerW / 2 : (i / (labels.length - 1)) * innerW);
  const y = (v) => padT + innerH - (v / top) * innerH;

  const wrap = document.createElement('div');
  wrap.className = 'viz';
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img', 'aria-label': opt.title || 'line chart' });
  svg.style.height = H + 'px';
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  ticks.forEach((t) => {
    svg.appendChild(el('line', { class: 'gridline', x1: padL, x2: padL + innerW, y1: y(t), y2: y(t) }));
    const tx = el('text', { class: 'tick', x: padL - 8, y: y(t) + 3.5, 'text-anchor': 'end' });
    tx.textContent = fmt(t);
    svg.appendChild(tx);
  });
  svg.appendChild(el('line', { class: 'axisline', x1: padL, x2: padL + innerW, y1: y(0), y2: y(0) }));

  const step = Math.max(1, Math.ceil(labels.length / 7));
  const last = labels.length - 1;
  labels.forEach((lb, i) => {
    if (i !== last && (i % step !== 0 || last - i < step * 0.7)) return;
    const tx = el('text', { class: 'tick', x: x(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : (i === labels.length - 1 ? 'end' : 'middle') });
    tx.textContent = opt.labelFormat ? opt.labelFormat(lb) : dLabel(lb);
    svg.appendChild(tx);
  });

  series.forEach((s, si) => {
    const color = s.color || SERIES_COLORS[si % 7];
    if (s.area) {
      const d = `M${x(0)},${y(0)} ` + s.values.map((v, i) => `L${x(i)},${y(v)}`).join(' ') + ` L${x(s.values.length - 1)},${y(0)} Z`;
      const g = el('path', { d, fill: hexOf(s, si), opacity: 0.12 });
      svg.appendChild(g);
    }
    const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' ');
    svg.appendChild(el('path', { class: 'serieline', d, stroke: color }));
    if (series.length <= 4 && s.values.length) {
      const lastV = s.values[s.values.length - 1];
      const t = el('text', { class: 'dlabel', x: x(s.values.length - 1) + 8, y: y(lastV) + 4 });
      t.textContent = fmt(lastV);
      svg.appendChild(t);
    }
  });

  // hover layer
  const ch = el('line', { class: 'crosshair', y1: padT, y2: padT + innerH, x1: -99, x2: -99 });
  svg.appendChild(ch);
  const dots = series.map((s, si) => {
    const c = el('circle', { class: 'hoverdot', r: 4.5, fill: s.color || SERIES_COLORS[si % 7], cx: -99, cy: -99, opacity: 0 });
    svg.appendChild(c); return c;
  });
  const hit = el('rect', { class: 'hit', x: padL, y: padT, width: innerW, height: innerH });
  svg.appendChild(hit);

  wrap.appendChild(svg);
  const tip = document.createElement('div');
  tip.className = 'tip';
  wrap.appendChild(tip);

  function move(ev) {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    let i = Math.round((px - padL) / (innerW || 1) * (labels.length - 1));
    i = Math.max(0, Math.min(labels.length - 1, i));
    ch.setAttribute('x1', x(i)); ch.setAttribute('x2', x(i));
    dots.forEach((c, si) => {
      c.setAttribute('cx', x(i)); c.setAttribute('cy', y(series[si].values[i])); c.setAttribute('opacity', 1);
    });
    tip.innerHTML = `<div class="t-h">${opt.labelFormat ? opt.labelFormat(labels[i]) : dLabel(labels[i])}</div>` +
      series.map((s, si) => `<div class="t-r"><span class="sw" style="background:${hexOf(s, si)}"></span><span>${s.name}</span><span class="n">${fmt(s.values[i])}</span></div>`).join('');
    tip.classList.add('on');
    const left = Math.min(r.width - 160, Math.max(0, (x(i) / W) * r.width - 70));
    tip.style.left = left + 'px';
    tip.style.top = '4px';
  }
  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseleave', () => {
    tip.classList.remove('on'); ch.setAttribute('x1', -99); ch.setAttribute('x2', -99);
    dots.forEach((c) => c.setAttribute('opacity', 0));
  });

  if (series.length >= 2) {
    const lg = document.createElement('div');
    lg.className = 'legend';
    lg.innerHTML = series.map((s, si) => `<span class="li"><span class="sw" style="background:${hexOf(s, si)}"></span>${s.name}</span>`).join('');
    wrap.appendChild(lg);
  }
  wrap.appendChild(tableFallback(['Date', ...series.map((s) => s.name)],
    labels.map((lb, i) => [opt.labelFormat ? opt.labelFormat(lb) : dLabel(lb), ...series.map((s) => num(s.values[i]))])));

  mount.appendChild(wrap);
  return wrap;
}

/* --------------------------- horizontal bars --------------------------- */
function barsH(mount, rows, opt) {
  opt = opt || {};
  const fmt = opt.format || kmb;
  const max = Math.max(1, ...rows.map((r) => r.value));
  const wrap = document.createElement('div');
  wrap.className = 'viz';
  const list = document.createElement('div');
  list.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
  rows.forEach((r) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:grid;grid-template-columns:' + (opt.labelWidth || '150px') + ' 1fr auto;gap:12px;align-items:center;';
    row.innerHTML =
      `<div style="font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${r.label}">${r.sub ? `<span style="color:var(--text)">${r.label}</span>` : r.label}</div>
       <div style="background:var(--surface-2);border-radius:4px;height:${opt.barH || 18}px;position:relative;">
         <div style="height:100%;width:${(r.value / max * 100).toFixed(2)}%;background:${r.color || 'var(--s1)'};border-radius:4px;min-width:2px;"></div>
       </div>
       <div style="font-size:12.5px;font-variant-numeric:tabular-nums;min-width:${opt.valueWidth || '58px'};text-align:right;">${fmt(r.value)}</div>`;
    row.title = `${r.label} — ${fmt(r.value)}${r.sub ? ' · ' + r.sub : ''}`;
    list.appendChild(row);
  });
  wrap.appendChild(list);
  wrap.appendChild(tableFallback([opt.labelHead || 'Item', opt.valueHead || 'Value'], rows.map((r) => [r.label, num(r.value)])));
  mount.appendChild(wrap);
  return wrap;
}

/* --------------------------- stacked split bar -------------------------- */
function splitBar(mount, parts, opt) {
  opt = opt || {};
  parts = parts.filter((p) => p.value > 0);
  if (!parts.length) { mount.innerHTML = '<div class="empty" style="padding:18px">No data yet.</div>'; return; }
  const total = parts.reduce((a, p) => a + p.value, 0) || 1;
  const wrap = document.createElement('div');
  const bar = document.createElement('div');

/* ------------------------------- sparkline ------------------------------ */
function sparkSvg(values, color) {
  if (!values || values.length < 2) return '';
  const W = 160, H = 34, max = Math.max(...values), min = Math.min(...values);
  const rng = max - min || 1;
  const pts = values.map((v, i) => `${(i / (values.length - 1) * W).toFixed(1)},${(H - 3 - ((v - min) / rng) * (H - 8)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="${color || 'var(--s1)'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"/></svg>`;
}

/* -------------------------------- funnel -------------------------------- */
function funnelView(mount, counts, total) {
  const max = Math.max(1, ...counts.map((c) => c.n));
  const wrap = document.createElement('div');
  wrap.className = 'funnel';
  counts.forEach((c, i) => {
    const prev = i ? counts[i - 1].n : c.n;
    const conv = prev ? c.n / prev : 0;
    const row = document.createElement('div');
    row.className = 'fn-row';
    row.innerHTML =
      `<div class="fl">${c.stage.label}</div>
       <div class="fn-track"><div class="fn-fill" style="width:${(c.n / max * 100).toFixed(1)}%;background:${c.stage.color};opacity:${0.55 + 0.05 * i};"></div></div>
       <div class="fv">${num(c.n)}${i ? `<em>${(conv * 100).toFixed(0)}%</em>` : ''}</div>`;
    row.title = `${c.stage.label}: ${c.n} — ${c.stage.desc}`;
    wrap.appendChild(row);
  });
  mount.appendChild(wrap);
  mount.appendChild(tableFallback(['Stage', 'Creators', 'Step conv.'],
    counts.map((c, i) => [c.stage.label, num(c.n), i ? pct(c.n / (counts[i - 1].n || 1), 0) : '—'])));
}

function deltaHtml(v, invert) {
  if (v == null || !isFinite(v)) return '';
  const good = invert ? v < 0 : v > 0;
  const cls = Math.abs(v) < 0.002 ? 'flat' : (good ? 'up' : 'down');
  const arrow = Math.abs(v) < 0.002 ? '–' : (v > 0 ? '▲' : '▼');
  return `<span class="delta ${cls}">${arrow} ${Math.abs(v * 100).toFixed(1)}%</span>`;
}
function statCard(label, value, opts) {

    ${opts.delta != null ? deltaHtml(opts.delta, opts.invert) : ''}

function copyText(text, what) {

    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
  toast('Downloaded ' + filename);
}
function csvEscape(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCsv(headers, rows) {
  return [headers.map(csvEscape).join(','), ...rows.map((r) => r.map(csvEscape).join(','))].join('\n');
}
function daysAgo(d) {
  if (!d) return '—';
  const n = Math.round((TODAY - new Date(d + 'T00:00:00Z')) / DAY);
  if (n === 0) return 'today';
  if (n === 1) return 'yesterday';
  if (n < 0) return 'in ' + (-n) + 'd';
  if (n < 30) return n + 'd ago';
  if (n < 365) return Math.round(n / 30) + 'mo ago';
  return Math.round(n / 365) + 'y ago';
}
function sortTable(rows, key, dir) {
  return rows.slice().sort((a, b) => {
    const x = key(a), y = key(b);
    if (typeof x === 'string') return dir * x.localeCompare(y);
    return dir * ((x || 0) - (y || 0));
  });
}

function activeCampaigns() { return DB.campaigns.filter((c) => c.status !== 'wrapped'); }

function alertsList() {
  const out = [];
  const push = (sev, kind, title, sub, href) => out.push({ sev, kind, title, sub, href });

  activeCampaigns().forEach((cp) => {
    const ps = partsOf(cp.id);
    const stale = ps.filter((p) => p.stage === 'contacted' && p.contactedAt && (TODAY - new Date(p.contactedAt)) / DAY > 7);
    if (stale.length) push('warning', 'chasing', `${stale.length} creators un-answered for 7+ days`, `${cp.brand} · ${cp.name}`, `#/campaigns/${cp.id}/roster`);

    const unshipped = ps.filter((p) => p.stage === 'confirmed' && p.confirmedAt && (TODAY - new Date(p.confirmedAt)) / DAY > 5);
    if (unshipped.length) push('serious', 'chasing', `${unshipped.length} confirmed creators not shipped yet`, `${cp.brand} · ${cp.name}`, `#/campaigns/${cp.id}/roster`);

    const lateContent = ps.filter((p) => p.stage === 'shipped' && p.shippedAt && (TODAY - new Date(p.shippedAt)) / DAY > 14);
    if (lateContent.length) push('critical', 'chasing', `${lateContent.length} shipped but no content after 14 days`, `${cp.brand} · ${cp.name}`, `#/campaigns/${cp.id}/roster`);

    const inReview = ps.filter((p) => p.stage === 'review' || p.stage === 'submitted');
    if (inReview.length >= 3) push('warning', 'chasing', `${inReview.length} drafts waiting on review`, `${cp.brand} · ${cp.name}`, `#/campaigns/${cp.id}/content`);

    const s = campaignStats(cp);
    const daysToStart = Math.round((new Date(cp.start) - TODAY) / DAY);
    if (daysToStart > -3 && daysToStart < 8 && s.confirmed < cp.targetCreators * 0.7)
      push('critical', 'chasing', `Only ${s.confirmed}/${cp.targetCreators} confirmed, starts ${daysToStart <= 0 ? 'already' : 'in ' + daysToStart + 'd'}`, `${cp.brand} · ${cp.name}`, `#/campaigns/${cp.id}/roster`);
  });

  DB.participants.filter((p) => p.content && p.stage === 'live' && viralScore(p) >= 5).slice(0, 8).forEach((p) => {
    const cr = byCreator[p.creatorId], cp = byCampaign[p.campaignId];
    push('good', 'wins', `${cr.handle} is outperforming — ${kmb(p.content.views)} views`, `${cp.brand} · ${viralScore(p).toFixed(1)}× their baseline · worth boosting`, `#/campaigns/${cp.id}/performance`);
  });

  const order = { critical: 0, serious: 1, warning: 2, good: 3 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

          ${statCard('Confirm rate', pct(f.counts[4].n / (f.counts[1].n || 1), 0), { foot: 'confirmed ÷ contacted' })}
          ${statCard('Delivery rate', pct(f.counts[8].n / (f.counts[4].n || 1), 0), { foot: 'live ÷ confirmed' })}
        </div>
      </div>
    </div>`;
  funnelView($('#ovFunnel'), f.counts, f.total);
  $('#ovFunnel').insertAdjacentHTML('beforeend',
    `<div style="margin-top:12px;font-size:12px;color:var(--text-3);">${num(f.dropped)} of ${num(f.total)} sourced dropped out or were declined along the way.</div>`);
}

function ovContent(view, tab) {
  const live = DB.participants.filter((p) => p.stage === 'live' && p.content);
  const key = tab === 'views' ? (p) => p.content.views : tab === 'comments' ? (p) => p.content.comments : (p) => viralScore(p);
  const rows = live.slice().sort((a, b) => key(b) - key(a)).slice(0, 25);

  view.innerHTML = `<div class="card" style="padding:0">
    <div style="padding:16px 20px 0"><div class="card-head"><h3>Top ${rows.length} posts ${tab === 'views' ? 'by views' : tab === 'comments' ? 'by comments' : 'by viral score'}</h3></div>
    <p class="card-sub">${tab === 'comments' || tab === 'views' ? 'Live posts only.' : "Viral score is views ÷ that creator's own average, weighted by shares and saves. 1.0× is a normal post for them."}</p></div>
    <div class="tbl-wrap" style="max-height:calc(100vh - 260px);overflow-y:auto" id="ovTop"></div></div>`;

  $('#ovTop').innerHTML = `<table class="tbl"><thead><tr>
      <th>Creator</th><th>Campaign</th><th>Format</th><th class="num">Views</th><th class="num">ER</th>
      <th class="num">Comments</th><th class="num">Saves</th><th class="num">Viral</th><th></th></tr></thead><tbody>${
      rows.map((p) => {
        const cr = byCreator[p.creatorId], cp = byCampaign[p.campaignId], c = p.content, v = viralScore(p);
        return `<tr class="clickable" onclick="showParticipant('${p.id}')">
          <td>${whoHtml(cr)}</td><td>${esc(cp.brand)}</td>
          <td><span class="tag">${esc(c.format)}</span>${c.boosted ? ' <span class="pill yellow">Ad</span>' : ''}</td>
          <td class="num">${num(c.views)}</td><td class="num">${pct(engagementsOf(c) / (c.views || 1))}</td>
          <td class="num">${num(c.comments)}</td><td class="num">${num(c.saves)}</td>
          <td class="num" style="color:${v >= 5 ? 'var(--good)' : v >= 3 ? 'var(--warning)' : 'var(--text-2)'};font-weight:500;">${v.toFixed(1)}×</td>
          <td><a href="${c.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">open</a></td></tr>`;
      }).join('')}</tbody></table>`;
}
/* ============================================================
   VIEW — CAMPAIGNS
   layer 2 = the campaign list · layer 3 = tabs on one campaign
   ============================================================ */
const CAMPAIGN_TABS = [
  ['roster', 'Roster & pipeline'], ['content', 'Content review'], ['performance', 'Performance'],
  ['creators', 'Creator results'], ['messages', 'Messages'], ['brief', 'Brief'], ['report', 'Report']
];

function renderCampaignSection(view, item, tab) {
  if (!item || item === 'all') return renderCampaignGrid(view, tab || 'active');
  return renderCampaign(view, item, tab || 'roster');
}

/* ------------------------------ all campaigns ------------------------------ */
function renderCampaignGrid(view, tab) {
  const list = DB.campaigns.filter((c) =>
    tab === 'all' ? true : tab === 'wrapped' ? c.status === 'wrapped' : c.status !== 'wrapped');

  if (!DB.campaigns.length) {
    view.innerHTML = emptyState('No campaigns yet',
      'Upload a delivery or 방문 sheet to build a campaign from your existing creator list, or set one up by hand and add creators from the database.',
      { icon: '▤' });
    return;
  }

  view.innerHTML = `
    <div class="card-head" style="margin-bottom:14px;">
      <span style="font-size:13px;color:var(--text-3)">${list.length} campaigns</span>
      <div class="sp"></div>
      <button class="btn sm" id="cpExport">Export list (CSV)</button>
      <button class="btn sm" id="cpImport">Import from Excel</button>
      <button class="btn primary sm" id="cpNew">New campaign</button>
    </div>
    <div class="grid g3" id="cpGrid"></div>`;

  $('#cpGrid').innerHTML = list.map((cp) => {
    const s = campaignStats(cp);
    const spark = s.views ? sparkSvg(dailySeries([cp], 21).views, SERIES_HEX[0]) : '';
    return `<div class="card" style="cursor:pointer" onclick="location.hash='#/campaigns/${cp.id}/roster'">
      <div class="card-head" style="align-items:flex-start">
        <div style="min-width:0">
          <div style="font-size:15px;font-weight:500;">${esc(cp.brand)}</div>
          <div style="font-size:12px;color:var(--text-3);margin-top:2px;">${esc(cp.kind)} · ${esc(cp.market)}</div>
        </div>
        <div class="sp"></div>${statusPill(cp.status)}
      </div>
      <div style="font-size:11.5px;color:var(--text-3);margin:10px 0 12px;">${dLabel(cp.start)} – ${dLabel(cp.end)} · owner ${esc(cp.owner)}</div>
      <div class="bar"><i style="width:${(s.progress * 100).toFixed(0)}%"></i></div>
      <div style="display:flex;gap:14px;font-size:11.5px;color:var(--text-3);margin-top:6px;">
        <span>${s.confirmed}/${cp.targetCreators} confirmed</span><span>${s.delivered} live</span>
      </div>
      ${spark ? `<div style="margin-top:12px">${spark}</div>` : '<div style="height:34px;margin-top:12px"></div>'}
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);">
        <div><div style="font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">Views</div><div style="font-size:16px;">${kmb(s.views)}</div></div>
        <div><div style="font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">ER</div><div style="font-size:16px;">${s.views ? pct(s.er) : '—'}</div></div>
        <div><div style="font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">CPM</div><div style="font-size:16px;">${s.reach ? money2(s.cpm) : '—'}</div></div>
      </div>
    </div>`;
  }).join('') || `<div class="empty">No campaigns in this view.</div>`;

  $('#cpNew').addEventListener('click', () => openNewCampaign());
  $('#cpImport').addEventListener('click', () => openImportWizard());
  $('#cpExport').addEventListener('click', () => {
    const rows = list.map((cp) => {
      const s = campaignStats(cp);
      return [cp.id, cp.brand, cp.name, cp.kind, cp.status, cp.market, cp.start, cp.end, cp.targetCreators,
              s.confirmed, s.delivered, s.views, s.eng, (s.er * 100).toFixed(2) + '%', Math.round(s.spend), Math.round(s.cpm), s.cpv.toFixed(2)];
    });
    downloadFile(toCsv(['id','brand','campaign','type','status','market','start','end','target','confirmed','delivered','views','engagements','er','spend_krw','cpm','cpv'], rows),
      'vively-campaigns.csv', 'text/csv;charset=utf-8');
  });
}

function openNewCampaign() {
  openDrawer('New campaign', `
    <div class="field"><label>Brand</label><input type="text" id="ncBrand" placeholder="e.g. TONYMOLY"/></div>
    <div class="field"><label>Campaign name</label><input type="text" id="ncName" placeholder="e.g. Autumn Seeding"/></div>
    <div class="grid g2">
      <div class="field"><label>Type</label><select id="ncKind">${['Seeding','Store visit','Paid collab','Product launch','Market validation'].map((k) => `<option>${k}</option>`).join('')}</select></div>
      <div class="field"><label>Category</label><select id="ncCat">${CATEGORIES.map((k) => `<option>${k}</option>`).join('')}</select></div>

      <div class="field"><label>Start</label><input type="date" id="ncStart" value="${iso(TODAY)}"/></div>
      <div class="field"><label>End</label><input type="date" id="ncEnd" value="${iso(addDays(TODAY, 35))}"/></div>
      <div class="field"><label>Min followers</label><input type="number" id="ncMin" value="10000"/></div>

      targetCreators: +$('#ncTarget').value || 30,
      minFollowers: +$('#ncMin').value || 0,
      platforms: ['Instagram'], deliverables: $('#ncDeliv').value,

      hashtags: ['#vively'], owner: 'Kunzang', note: $('#ncNote').value, createdAt: iso(TODAY)
    };
    DB.campaigns.push(cp); byCampaign[id] = cp;

}

/* ------------------------------ one campaign ------------------------------ */
function renderCampaign(view, id, tab) {
  const cp = byCampaign[id];
  if (!cp) { view.innerHTML = `<div class="empty">Campaign not found.</div>`; return; }
  const s = campaignStats(cp);

  view.innerHTML = `
    <div class="card-head" style="margin-bottom:14px;">
      <div style="font-size:12.5px;color:var(--text-3);">
        ${esc(cp.name)} · ${dLabel(cp.start)}–${dLabel(cp.end)} · ${esc(cp.market)} · ${esc(cp.deliverables)} · owner ${esc(cp.owner)}
      </div>
      <div class="sp"></div>
      ${s.viralCount ? `<span class="pill green">${s.viralCount} viral</span>` : ''}
      <select id="cpStatus" style="width:145px">${Object.entries(CAMPAIGN_STATUS).map(([k, v]) => `<option value="${k}" ${cp.status === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select>
      <button class="btn sm no-print" id="cpEdit">Edit</button>
      <button class="icon-btn no-print" id="cpDelete" title="Delete this campaign">&#128465;</button>
    </div>

    <div class="grid g6" style="margin-bottom:16px;">
      ${statCard('Confirmed', `${s.confirmed}<span style="font-size:15px;color:var(--text-3)"> / ${cp.targetCreators}</span>`, { foot: `${num(s.contacted)} contacted` })}
      ${statCard('Delivered', s.delivered, { foot: `${pct(s.deliveryRate, 0)} of confirmed` })}
      ${statCard('Views', kmb(s.views), { foot: `${pct(s.paidViews / (s.views || 1), 0)} paid` })}
      ${statCard('Engagement rate', s.views ? pct(s.er) : '—', { foot: `${kmb(s.eng)} total` })}
      ${statCard('Spend', wonK(s.spend), { foot: `${wonK(cp.budget)} budget` })}
      ${statCard('CPM', s.reach ? money2(s.cpm) : '—', { hint: 'Spend ÷ reach × 1,000', foot: s.views ? `CPV ${money2(s.cpv)}` : '' })}
    </div>

    <div id="cpTab"></div>`;

  $('#cpStatus').addEventListener('change', (e) => { cp.status = e.target.value; toast('Status updated'); render(); });
  $('#cpEdit').addEventListener('click', () => openEditCampaign(cp));
  $('#cpDelete').addEventListener('click', () => confirmDeleteCampaign(cp));

  const mount = $('#cpTab');
  ({ roster: rosterTab, content: contentTab, performance: campaignPerformanceTab, creators: campaignCreatorsTab,
     messages: messagesTab, brief: briefTab, report: reportTab }[tab] || rosterTab)(mount, cp);
}

/* ------------------------------ edit & delete ------------------------------ */
function campaignFormHtml(cp) {
  return `
    <div class="grid g2" style="gap:10px">
      <div class="field"><label>Brand / client</label><input type="text" id="ecBrand" value="${esc(cp.brand)}"/></div>
      <div class="field"><label>Project name</label><input type="text" id="ecName" value="${esc(cp.name)}"/></div>
      <div class="field"><label>Type</label><select id="ecKind">${
        ['Seeding','Store visit','Paid collab','Product launch','Market validation']
          .map((k) => `<option ${cp.kind === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
      <div class="field"><label>Category</label><select id="ecCat">${
        CATEGORIES.map((k) => `<option ${cp.category === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
      <div class="field"><label>Market</label><select id="ecMarket">${
        [...new Set([cp.market, ...COUNTRIES])].filter(Boolean).map((k) => `<option ${cp.market === k ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></div>

      <div class="field"><label>End</label><input type="date" id="ecEnd" value="${esc(cp.end)}"/></div>
      <div class="field"><label>Target creators</label><input type="number" id="ecTarget" value="${cp.targetCreators}"/></div>
      <div class="field"><label>Min followers</label><input type="number" id="ecMin" value="${cp.minFollowers || 0}"/></div>
      <div class="field"><label>Product / visit cost each (₩)</label><input type="number" id="ecCost" value="${cp.productCostPer || 0}"/></div>
      <div class="field"><label>Ad spend (₩)</label><input type="number" id="ecAd" value="${cp.adSpend || 0}"/></div>
      <div class="field"><label>Budget (₩)</label><input type="number" id="ecBudget" value="${cp.budget || 0}"/></div>
      <div class="field"><label>Owner</label><input type="text" id="ecOwner" value="${esc(cp.owner || '')}"/></div>

    <div class="field"><label>Platforms (comma separated)</label><input type="text" id="ecPlatforms" value="${esc((cp.platforms || []).join(', '))}"/></div>
    <div class="field"><label>Hashtags (comma separated)</label><input type="text" id="ecHashtags" value="${esc((cp.hashtags || []).join(', '))}"/></div>
    <div class="field"><label>Campaign note — the message generator writes from this</label>

function readCampaignForm(cp) {
  const list = (v) => v.split(',').map((x) => x.trim()).filter(Boolean);
  cp.brand = $('#ecBrand').value.trim() || cp.brand;
  cp.name = $('#ecName').value.trim() || cp.name;
  cp.kind = $('#ecKind').value;
  cp.category = $('#ecCat').value;
  cp.market = $('#ecMarket').value;
  cp.status = $('#ecStatus').value;
  cp.start = $('#ecStart').value;
  cp.end = $('#ecEnd').value;
  cp.targetCreators = +$('#ecTarget').value || 0;
  cp.minFollowers = +$('#ecMin').value || 0;
  cp.productCostPer = +$('#ecCost').value || 0;
  cp.adSpend = +$('#ecAd').value || 0;
  cp.budget = +$('#ecBudget').value || 0;
  cp.owner = $('#ecOwner').value.trim();
  cp.deliverables = $('#ecDeliv').value.trim();
  cp.platforms = list($('#ecPlatforms').value);
  cp.hashtags = list($('#ecHashtags').value);
  cp.note = $('#ecNote').value;
}

function openEditCampaign(cp) {
  openDrawer(`Edit — ${esc(cp.brand)}`, campaignFormHtml(cp) + `
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn primary" id="ecSave">Save changes</button>
      <button class="btn" onclick="closeDrawer()">Cancel</button>
      <div style="flex:1"></div>
      <button class="btn" id="ecDelete" style="color:#f08a8a;border-color:rgba(208,59,59,.4)">Delete campaign</button>
    </div>`, true);
  $('#ecSave').addEventListener('click', () => {
    readCampaignForm(cp);
    closeDrawer(); render(); toast('Campaign updated');
  });
  $('#ecDelete').addEventListener('click', () => { closeDrawer(); confirmDeleteCampaign(cp); });
}

function confirmDeleteCampaign(cp) {
  const rows = partsOf(cp.id);
  const creatorIds = new Set(rows.map((r) => r.creatorId));
  const orphaned = [...creatorIds].filter((id) =>
    !DB.participants.some((p) => p.creatorId === id && p.campaignId !== cp.id)).length;

  openDrawer('Delete campaign', `
    <div class="note warn" style="margin-bottom:16px">
      <strong>${esc(cp.brand)} — ${esc(cp.name)}</strong> and its ${rows.length} roster row${rows.length === 1 ? '' : 's'}
      will be removed. This cannot be undone.
    </div>
    <dl class="kv" style="margin-bottom:18px">
      <dt>Roster rows removed</dt><dd>${rows.length}</dd>
      <dt>Creators involved</dt><dd>${creatorIds.size}</dd>
      <dt>Creators kept in the database</dt><dd style="color:#6fce6f">all ${creatorIds.size} — including the ${orphaned} who appear on no other campaign</dd>
      <dt>Content records removed</dt><dd>${rows.filter((r) => r.content).length}</dd>
    </dl>
    <p class="card-sub">The creator database is never touched by a campaign deletion. Handles, follower counts, contact
    details, blacklist flags and notes all stay exactly as they are — only this campaign's participation rows go.</p>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn" id="dcBackup">Download backup first</button>
      <div style="flex:1"></div>
      <button class="btn" onclick="closeDrawer()">Cancel</button>
      <button class="btn primary" id="dcGo" style="background:var(--critical);border-color:var(--critical);color:#fff">Delete campaign</button>
    </div>`);
  $('#dcBackup').addEventListener('click', () => downloadFile(
    JSON.stringify({ savedAt: new Date().toISOString(), db: DB, settings: SETTINGS }, null, 2),
    `vively-workspace-${iso(new Date())}.json`, 'application/json'));
  $('#dcGo').addEventListener('click', () => {
    deleteCampaign(cp.id);
    closeDrawer();
    location.hash = '#/campaigns/all/active';
    toast(`Deleted ${cp.brand} — ${creatorIds.size} creators kept`);
    render();
  });
}

/* removes the campaign and its roster rows. Creators are deliberately left alone. */
function deleteCampaign(id) {
  DB.participants = DB.participants.filter((p) => p.campaignId !== id);
  DB.campaigns = DB.campaigns.filter((c) => c.id !== id);
  delete byCampaign[id];
  recomputeCreatorStats();
  persist(true);
}

/* --------------------------- roster / pipeline --------------------------- */
function rosterTab(mount, cp) {
  const ps = partsOf(cp.id);
  mount.innerHTML = `
    <div class="card-head" style="margin-bottom:12px;">
      <div class="seg no-print" id="boardSeg">
        <button data-m="board" class="${state.boardMode === 'board' ? 'active' : ''}">Board</button>
        <button data-m="table" class="${state.boardMode === 'table' ? 'active' : ''}">Table</button>
      </div>
      <div class="sp"></div>
      <span style="font-size:12px;color:var(--text-3)">${ps.length} sourced · drag cards between columns</span>
      <button class="btn sm" id="rosterCsv">Export roster</button>
      <button class="btn primary sm" id="addCreators">+ Add creators</button>
    </div>
    <div id="rosterBody"></div>`;

  const body = $('#rosterBody');
  if (state.boardMode === 'board') renderBoard(body, cp); else renderRosterTable(body, cp);

  $('#boardSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state.boardMode = b.dataset.m; render();
  });
  $('#addCreators').addEventListener('click', () => openAddCreators(cp));
  $('#rosterCsv').addEventListener('click', () => exportRoster(cp));
}

function renderBoard(mount, cp) {
  const ps = partsOf(cp.id);
  mount.innerHTML = `<div class="kb">${STAGES.map((st) => {
    const items = ps.filter((p) => p.stage === st.id);
    return `<div class="kb-col" data-stage="${st.id}">
      <header><span style="width:8px;height:8px;border-radius:50%;background:${st.color};display:inline-block"></span>
        <span class="kh">${st.label}</span><span class="kc">${items.length}</span></header>
      <div class="kb-list" data-stage="${st.id}">${items.map((p) => {
        const cr = byCreator[p.creatorId];
        return `<div class="kb-card" draggable="true" data-pid="${p.id}">
          ${whoHtml(cr)}
          <div class="kb-meta"><span>ER ${cr.er}%</span><span>${esc(cr.country)}</span>${p.fee ? `<span>${wonK(p.fee)}</span>` : ''}</div>
          ${p.dropReason ? `<div style="font-size:11px;color:var(--text-3);margin-top:5px">${esc(p.dropReason)}</div>` : ''}
          ${p.content && p.content.views ? `<div style="font-size:11px;color:var(--text-2);margin-top:5px">${kmb(p.content.views)} views</div>` : ''}
        </div>`;
      }).join('') || '<div style="font-size:12px;color:var(--text-3);padding:8px 2px">—</div>'}</div>
    </div>`;
  }).join('')}</div>`;

  let dragged = null;
  $$('.kb-card', mount).forEach((c) => {
    c.addEventListener('dragstart', () => { dragged = c.dataset.pid; c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
    c.addEventListener('click', () => showParticipant(c.dataset.pid));
  });
  $$('.kb-list', mount).forEach((l) => {
    l.addEventListener('dragover', (e) => { e.preventDefault(); l.classList.add('over'); });
    l.addEventListener('dragleave', () => l.classList.remove('over'));
    l.addEventListener('drop', (e) => {
      e.preventDefault(); l.classList.remove('over');
      const p = DB.participants.find((x) => x.id === dragged);
      if (!p) return;
      moveStage(p, l.dataset.stage); render();
    });
  });
}

function moveStage(p, stage) {
  p.stage = stage;
  const t = iso(TODAY);
  if (stage === 'contacted' && !p.contactedAt) p.contactedAt = t;
  if (STAGE_IDX[stage] >= 2 && !p.repliedAt && stage !== 'dropped') p.repliedAt = t;
  if (STAGE_IDX[stage] >= 4 && !p.confirmedAt && stage !== 'dropped') p.confirmedAt = t;
  if (STAGE_IDX[stage] >= 5 && !p.shippedAt && stage !== 'dropped') p.shippedAt = t;
  toast(byCreator[p.creatorId].handle + ' → ' + stageOf(stage).label);
}

function renderRosterTable(mount, cp) {
  const ps = partsOf(cp.id);
  mount.innerHTML = `<div class="card" style="padding:0"><div class="tbl-wrap" style="max-height:56vh;overflow-y:auto"><table class="tbl">
