/* --------------------------- add creators (autosuggest) --------------------------- */
function openAddCreators(cp) {
  const already = new Set(partsOf(cp.id).map((p) => p.creatorId));
  openDrawer(`Add creators — ${esc(cp.brand)}`, `
    <div class="note" style="margin-bottom:16px;">
      Type a handle, name, category or country. Suggestions are scored against this campaign:
      <strong>${esc(cp.category)}</strong> · <strong>${esc(cp.market)}</strong> · min ${kmb(cp.minFollowers)} followers · ${cp.platforms.join(', ')}.
      ${hiddenBlocked ? `<div style="margin-top:6px">${hiddenBlocked} blacklisted creators are hidden. <a href="#/settings/blacklist" onclick="closeDrawer()">Manage the blacklist</a>.</div>` : ''}
    </div>
    <div class="ac-wrap field">
      <label>Search the creator database (${DB.creators.length} creators)</label>
      <input type="text" id="acInput" placeholder="e.g. beauty vietnam, or @seoul.diary" autocomplete="off"/>
      <div class="ac-list" id="acList"></div>
    </div>
    <div class="lbl" style="margin-top:18px">Best matches not yet on this campaign</div>
    <div id="acSuggest"></div>
    <div class="divider"></div>
    <div class="lbl">Selected <span id="acCount">0</span></div>
    <div id="acPicked" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;"></div>
    <button class="btn primary" id="acAdd">Add to campaign as “Sourced”</button>
  `);

  const picked = new Map();
  const scored = selectable(DB.creators.filter((c) => !already.has(c.id)))
    .map((c) => ({ c, ...suggestScore(c, cp) }))
    .filter((s) => !s.blocked)
    .sort((a, b) => b.score - a.score);
  const hiddenBlocked = DB.creators.filter((c) => !already.has(c.id) && isBlocked(c)).length;

  function renderPicked() {
    $('#acCount').textContent = picked.size;
    $('#acPicked').innerHTML = [...picked.values()].map((c) =>
      `<span class="pill blue" style="cursor:pointer" data-un="${c.id}">${esc(c.handle)} ×</span>`).join('') || '<span style="font-size:12px;color:var(--text-3)">none yet</span>';
    $$('#acPicked .pill').forEach((p) => p.addEventListener('click', () => { picked.delete(p.dataset.un); renderPicked(); }));
  }
  function rowHtml(s, q) {
    const c = s.c;
    const hl = (t) => q ? esc(t).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>') : esc(t);
    return `<div class="ac-item" data-id="${c.id}">
      ${avatarHtml(c.handle)}
      <div style="min-width:0;flex:1">
        <div style="font-size:13px;font-weight:500">${hl(c.handle)} <span style="color:var(--text-3);font-weight:400">${hl(c.name)}</span> ${flagPill(c.flag)}</div>
        <div style="font-size:11.5px;color:var(--text-3)">${kmb(c.followers)} · ER ${c.er}% · ${esc(c.country)} · ${esc(c.categories.join(', '))}${c.campaignsDone ? ` · ${c.campaignsDone} past` : ' · new'}</div>
        ${s.reasons.length ? `<div style="font-size:11px;color:var(--text-3);margin-top:3px">${s.reasons.map((r) => `<span class="tag">${esc(r)}</span>`).join(' ')}</div>` : ''}
      </div>
      <div class="score">${s.score}</div>
    </div>`;
  }
  function bind(container) {
    $$('.ac-item', container).forEach((it) => it.addEventListener('click', () => {
      const c = byCreator[it.dataset.id];
      picked.set(c.id, c); renderPicked();
      $('#acList').classList.remove('open'); $('#acInput').value = '';
    }));
  }

  $('#acSuggest').innerHTML = `<div class="ac-list open" style="position:static;max-height:280px">${scored.slice(0, 10).map((s) => rowHtml(s, '')).join('')}</div>`;
  bind($('#acSuggest'));

  const input = $('#acInput'), list = $('#acList');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { list.classList.remove('open'); return; }
    const terms = q.split(/\s+/);
    const hits = scored.filter((s) => {
      const hay = (s.c.handle + ' ' + s.c.name + ' ' + s.c.categories.join(' ') + ' ' + s.c.country + ' ' + s.c.platform + ' ' + s.c.tier + ' ' + s.c.tags.join(' ')).toLowerCase();
      return terms.every((t) => hay.includes(t));
    }).slice(0, 25);
    list.innerHTML = hits.length ? hits.map((s) => rowHtml(s, terms[0])).join('') : '<div class="ac-empty">No creator matches. They may already be on this campaign.</div>';
    list.classList.add('open'); bind(list);
  });
  input.addEventListener('blur', () => setTimeout(() => list.classList.remove('open'), 180));

  renderPicked();
  $('#acAdd').addEventListener('click', () => {
    if (!picked.size) { toast('Pick at least one creator'); return; }
    picked.forEach((c) => {
      if (DB.participants.some((p) => p.campaignId === cp.id && p.creatorId === c.id)) return;
      DB.participants.push({
        id: cp.id + '-' + c.id, campaignId: cp.id, creatorId: c.id, stage: 'sourced',
        source: c.source, fee: 0, contactedAt: null, repliedAt: null, confirmedAt: null,
        shippedAt: null, dropReason: null, revisions: 0, content: null, note: ''
      });
    });
    toast(picked.size + ' creators added');
    closeDrawer(); render();
  });
}

      ${statCard('Live posts', live.length)}
      ${statCard('Revisions requested', ps.reduce((a, p) => a + p.revisions, 0))}
      ${statCard('Avg. turnaround', ps.length ? (ps.reduce((a, p) => a + (p.shippedAt && p.content.submittedAt ? (new Date(p.content.submittedAt) - new Date(p.shippedAt)) / DAY : 0), 0) / ps.length).toFixed(1) + ' d' : '—', { foot: 'ship → draft in' })}

  if (pending.length) {
    $('#reviewQ').innerHTML = pending.map((p) => {
      const cr = byCreator[p.creatorId], c = p.content;
      return `<div class="card tight" style="flex:0 0 230px">
        <div style="aspect-ratio:16/6;border-radius:8px;background:linear-gradient(140deg, ${c.thumbTint}33, ${c.thumbTint}11);display:grid;place-items:center;color:${c.thumbTint};font-size:20px;margin-bottom:10px;">▶</div>
        <div class="who" style="margin-bottom:8px">${avatarHtml(cr.handle)}<div><div class="h">${esc(cr.handle)}</div><div class="s">${esc(c.format)} · submitted ${daysAgo(c.submittedAt)}</div></div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${stagePill(p.stage)}${p.revisions ? `<span class="pill yellow">rev ${p.revisions}</span>` : ''}</div>

          <button class="btn xs" data-revise="${p.id}">Request revision</button>
        </div>
      </div>`;
    }).join('');

      toast('Approved — moved to Live'); render();
    }));
    $$('[data-revise]', mount).forEach((b) => b.addEventListener('click', () => openRevision(b.dataset.revise)));
  }

  $('#contentTbl').innerHTML = ps.length ? `<table class="tbl"><thead><tr>
      <th>Creator</th><th>Format</th><th>Stage</th><th>Posted</th><th class="num">Views</th><th class="num">Organic</th>

function openRevision(pid) {
  const p = DB.participants.find((x) => x.id === pid);
  const cr = byCreator[p.creatorId], cp = byCampaign[p.campaignId];
  openDrawer('Request revision', `
    <div class="who" style="margin-bottom:16px">${avatarHtml(cr.handle, true)}<div><div class="h" style="font-size:15px">${esc(cr.handle)}</div><div class="s">${esc(cp.brand)} · ${esc(p.content.format)}</div></div></div>
    <div class="field"><label>What needs to change</label>
      <div class="chips" id="revTypes">${REVISION_TYPES.map((t) => `<button class="chip" data-t="${t}">${t}</button>`).join('')}</div></div>
    <div class="field"><label>Timestamp (optional)</label><input type="text" id="revTime" placeholder="e.g. 00:04 – 00:09"/></div>
    <div class="field"><label>Details</label><textarea id="revNote" placeholder="Be specific — the creator sees this verbatim."></textarea></div>
    <div class="field"><label>Message to send</label><div class="msg-out" id="revPreview"></div></div>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="revSend">Log revision &amp; copy message</button>
      <button class="btn" onclick="closeDrawer()">Cancel</button>
    </div>
  `);
  const chosen = new Set();
  const build = () => {
    const list = [...chosen];
    const txt = `Hi ${cr.handle.replace('@', '')}! Thank you so much for the ${p.content.format.toLowerCase()} — it looks great. Before it goes live we have a small revision request from ${cp.brand}:\n\n` +
      (list.length ? list.map((t) => `• ${t}`).join('\n') + '\n\n' : '') +
      ($('#revTime').value ? `Timestamp: ${$('#revTime').value}\n` : '') +
      ($('#revNote').value ? `${$('#revNote').value}\n` : '') +
      `\nCould you send the updated version within 2 days? Let me know if anything is unclear — happy to jump on a quick call.\n\nThank you!\nVIVELY`;
    $('#revPreview').textContent = txt;
    return txt;
  };
  $$('#revTypes .chip').forEach((c) => c.addEventListener('click', () => {
    c.classList.toggle('on');
    chosen.has(c.dataset.t) ? chosen.delete(c.dataset.t) : chosen.add(c.dataset.t);
    build();
  }));
  ['revTime', 'revNote'].forEach((id) => $('#' + id).addEventListener('input', build));
  build();
  $('#revSend').addEventListener('click', () => {
    p.revisions++; p.stage = 'review';
    copyText(build(), 'Revision request');
    closeDrawer(); render();
  });
}

    .sort((a, b) => b.value - a.value).slice(0, 8), { labelHead: 'Creator', valueHead: 'Views' });

  const tierRows = ['nano', 'micro', 'mid', 'macro'].map((t) => {
    const ps = live.filter((p) => byCreator[p.creatorId].tier === t);
    if (!ps.length) return null;
    const views = ps.reduce((a, p) => a + p.content.views, 0);
    const reach = ps.reduce((a, p) => a + p.content.reach, 0);
    const eng = ps.reduce((a, p) => a + engagementsOf(p.content), 0);
    const spend = ps.length * cp.productCostPer + ps.reduce((a, p) => a + p.fee, 0);
    return [t[0].toUpperCase() + t.slice(1), ps.length, kmb(views), pct(eng / (views || 1)),
            money2(reach ? spend / reach * 1000 : 0), money2(views ? spend / views : 0)];
  }).filter(Boolean);
  $('#caTier').innerHTML = `<table class="tbl"><thead><tr><th>Tier</th><th class="num">Posts</th><th class="num">Views</th><th class="num">ER</th><th class="num">CPM</th><th class="num">CPV</th></tr></thead>
    <tbody>${tierRows.map((r) => `<tr>${r.map((c, i) => `<td${i ? ' class="num"' : ' class="strong"'}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  const viral = live.map((p) => ({ p, v: viralScore(p) })).sort((a, b) => b.v - a.v);
  $('#caViral').innerHTML = `<table class="tbl"><thead><tr><th>Creator</th><th class="num">Views</th><th class="num">vs baseline</th><th class="num">Comments</th><th class="num">Share+save rate</th><th class="num">Score</th></tr></thead>
    <tbody>${viral.map(({ p, v }) => {
      const cr = byCreator[p.creatorId], c = p.content;
      return `<tr class="clickable" onclick="showParticipant('${p.id}')">
        <td>${whoHtml(cr)}</td><td class="num">${num(c.views)}</td>
        <td class="num">${(c.views / (cr.avgViews || 1)).toFixed(1)}×</td>
        <td class="num">${num(c.comments)}</td>
        <td class="num">${pct((c.shares + c.saves) / (c.views || 1), 2)}</td>
        <td class="num" style="color:${v >= 5 ? 'var(--good)' : v >= 3 ? 'var(--warning)' : 'var(--text-2)'};font-weight:500">${v.toFixed(1)}</td></tr>`;
    }).join('')}</tbody></table>`;
}

function renderAnalytics(view, item, tab) {
  const all = DB.campaigns;
  if (!all.length) {
    view.innerHTML = emptyState('No analytics yet',
      'Analytics appear once a campaign has live content with view and engagement numbers on it.', { icon: '◫' });
    return;
  }
  if (!DB.participants.some((p) => p.stage === 'live' && p.content && p.content.views)) {
    view.innerHTML = emptyState('No performance data yet',
      'Your campaigns are loaded, but none of the posts have metrics attached. Add views, likes, comments, shares and saves on a creator\u2019s content card and these charts fill in.',
      { icon: '◫', actions: false });
    return;
  }
  const s = portfolioStats(all);
  const live = DB.participants.filter((p) => p.stage === 'live' && p.content);
  const withLive = all.map((cp) => ({ cp, s: campaignStats(cp) })).filter((x) => x.s.views);

  if (item === 'compare')   return anCompare(view, tab, withLive);
  if (item === 'cost')      return anCost(view, tab, s, withLive, live);
  if (item === 'breakdown') return anBreakdown(view, tab, s, live);
  if (item === 'viral')     return anViral(view, tab, live);

  /* trend */
  const ds = dailySeries(all, state.range);
  const isEng = tab === 'engagement';
  view.innerHTML = `
    <div class="grid g4" style="margin-bottom:16px;">
      ${statCard('Total views', kmb(s.views), { foot: `${num(live.length)} posts across ${all.length} campaigns` })}
      ${statCard('Total reach', kmb(s.reach), { foot: `${pct(s.organicViews / (s.views || 1), 0)} of views organic` })}
      ${statCard('Engagement rate', pct(s.er), { foot: `${kmb(s.eng)} engagements` })}
      ${statCard('Total spend', wonK(s.spend), { foot: 'product + fees + ads' })}
    </div>
    <div class="card">
      <div class="card-head"><h3>${isEng ? 'Daily engagements' : 'Daily views'}</h3><div class="sp"></div>${rangeSeg()}
        <button class="btn sm" id="anExport">Export dataset</button></div>
      <p class="card-sub">Every campaign combined.</p>
      <div id="anTrend"></div>
    </div>`;
  lineChart($('#anTrend'), {
    labels: ds.labels, height: fitHeight(430, 240),
    series: [isEng ? { name: 'Engagements', values: ds.eng, color: 'var(--s2)', area: true }
                   : { name: 'Views', values: ds.views, area: true }]
  });
  wireRange();
  $('#anExport').addEventListener('click', () => exportContentDataset(live));
}

function exportContentDataset(live) {
  const rows = live.map((p) => {
    const cr = byCreator[p.creatorId], cp = byCampaign[p.campaignId], c = p.content;
    return [cp.brand, cp.name, cr.handle, cr.tier, cr.country, c.platform, c.format, c.postedAt, c.views, c.organicViews, c.paidViews,
            c.reach, c.likes, c.comments, c.shares, c.saves, engagementsOf(c), (engagementsOf(c) / (c.views || 1) * 100).toFixed(2) + '%', viralScore(p), c.url];
  });
  downloadFile(toCsv(['brand','campaign','handle','tier','country','platform','format','posted','views','organic_views','paid_views','reach','likes','comments','shares','saves','engagements','er','viral_score','url'], rows),

  view.innerHTML = `<div class="grid g-2-1">

    </div>`;

  let parts;
  if (tab === 'organic') {
    parts = [{ label: 'Organic', value: s.organicViews, color: 'var(--s1)' }, { label: 'Paid / boosted', value: s.paidViews, color: 'var(--s2)' }];
  } else if (tab === 'tier') {
    parts = ['nano', 'micro', 'mid', 'macro'].map((t, i) => ({
      label: t[0].toUpperCase() + t.slice(1), color: SERIES_HEX[[0, 2, 4, 3][i]],
      value: live.filter((p) => byCreator[p.creatorId].tier === t).reduce((a, p) => a + p.content.views, 0)
    })).filter((x) => x.value);
  } else if (tab === 'format') {
    parts = CONTENT_FORMATS.map((f, i) => ({
      label: f, color: SERIES_HEX[i % 7],
      value: live.filter((p) => p.content.format === f).reduce((a, p) => a + p.content.views, 0)
    })).filter((x) => x.value);
  } else {
    parts = PLATFORMS.map((pl, i) => ({

    })).filter((x) => x.value);
  }
  splitBar($('#anSplit'), parts);

  const total = parts.reduce((a, p) => a + p.value, 0) || 1;
  const groupOf = tab === 'tier' ? (p) => byCreator[p.creatorId].tier[0].toUpperCase() + byCreator[p.creatorId].tier.slice(1)

      const ps = groupOf ? live.filter((p) => groupOf(p) === seg.label) : live;
      const eng = ps.reduce((a, p) => a + engagementsOf(p.content), 0);
      const vw = ps.reduce((a, p) => a + p.content.views, 0);
      return `<tr><td class="strong"><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${seg.color};margin-right:8px"></span>${esc(seg.label)}</td>
        <td class="num">${groupOf ? ps.length : '—'}</td><td class="num">${num(seg.value)}</td>
        <td class="num">${pct(seg.value / total)}</td><td class="num">${groupOf ? pct(eng / (vw || 1)) : '—'}</td></tr>`;
    }).join('')}</tbody></table>`;
}

/* ============================================================
   MESSAGE GENERATOR
   Turns the campaign note into the message you actually send.
   ============================================================ */
const MSG_KINDS = [
  ['outreach',    'First outreach DM',      'sourced'],
  ['followup',    'Follow-up nudge',        'contacted'],
  ['confirm',     'Confirmation to participate', 'shortlisted'],
  ['address',     'Address / visit booking', 'confirmed'],
  ['shipped',     'Shipped + guidelines',   'shipped'],
  ['reminder',    'Posting reminder',       'shipped'],
  ['thanks',      'Post-live thank you + analytics request', 'live'],
  ['decline',     'Polite decline',         'replied']
];

/* pull the useful lines out of a free-text campaign note */
function parseNote(note) {
  const lines = String(note || '').split('\n').map((l) => l.trim()).filter(Boolean);
  const find = (re) => (lines.find((l) => re.test(l)) || '').replace(/^[^:]*:\s*/, '');
  return {
    gets:     find(/what the creator gets|creator gets|제공/i),
    needs:    find(/what we need back|deliverable|need back|촬영/i),
    window:   find(/posting window|window|기한|마감/i),
    tagging:  find(/must tag|tag |해시태그/i),
    rules:    lines.filter((l) => /^no |avoid|preferred|please keep/i.test(l)).join(' '),
    all: lines
  };
}

const TONE = {
  friendly:     { hi: (n) => `Hi ${n}! 👋`, sign: 'Warmly,\nVIVELY', pace: '' },
  professional: { hi: (n) => `Hello ${n},`, sign: 'Best regards,\nVIVELY Creator Partnerships', pace: '' },
  casual:       { hi: (n) => `hey ${n}!`,   sign: '— VIVELY', pace: '' }
};

function buildMessage(kind, cp, cr, tone, lang) {
  const n  = cr ? cr.handle.replace('@', '') : '{{creator}}';
  const t  = TONE[tone] || TONE.friendly;
  const p  = parseNote(cp.note);
  const brand = cp.brand;
  const deadline = dLabel(cp.end);
  const gets  = p.gets  || `the full ${brand} product set, shipped free`;
  const needs = p.needs || cp.deliverables;
  const win   = p.window || 'within 10 days of delivery';
  const tagging = p.tagging || `tag @${brand.toLowerCase().replace(/\W/g, '')} and use ${cp.hashtags.join(' ')}`;
  /* don't repeat a rule that already appears inside the posting-window line */
  const rules = (p.rules || '').split(/(?<=\.)\s+/).filter((r) => r && !win.includes(r.trim())).join(' ');
  const personal = cr
    ? `I've been following your ${cr.categories[0].toLowerCase()} content — the way you shoot ${cr.platform === 'TikTok' ? 'your TikToks' : 'your reels'} is exactly the mood ${brand} is going for.`
    : `I've been following your content and it's exactly the mood ${brand} is going for.`;

  const EN = {
    outreach: `${t.hi(n)}

I'm reaching out from VIVELY — we run creator campaigns in Korea and across Southeast Asia. We're working with ${brand} on a ${cp.kind.toLowerCase()} campaign${cp.market ? ` for the ${cp.market} market` : ''}, and I'd love to have you on it.

${personal}

What you'd get: ${gets}
What we'd need: ${needs}
Timing: ${win} — campaign runs until ${deadline}
${cr && cr.rate ? `Fee: negotiable, we budget around ${wonK(cr.rate)} for creators at your size.\n` : ''}
If that sounds interesting, just reply here and I'll send the full brief. No pressure either way — thank you for reading!

${t.sign}`,

    followup: `${t.hi(n)}

Just floating this back up — we're closing the ${brand} lineup this week and I'd hate for you to miss it. Same offer as before: ${gets}, in exchange for ${needs.toLowerCase()}.

A yes or no is totally fine, I just don't want to keep you in limbo. 🙏

${t.sign}`,

    confirm: `${t.hi(n)}

Great news — ${brand} confirmed you for the campaign! 🎉

Here's everything in one place:
• Deliverables: ${needs}
• Posting window: ${win}
• Campaign ends: ${deadline}
• Tagging: ${tagging}
${rules ? `• Please note: ${rules}\n` : ''}${cr && cr.rate ? `• Fee: ${wonK(cr.rate)}, paid within 14 days of the post going live\n` : ''}
To lock it in, could you reply with:
1. Full name
2. Shipping address + postcode
3. Phone number for the courier
4. The date you expect to post

Once I have those I'll get the parcel out the same day. Really excited to see what you make!

${t.sign}`,

function renderMessagesSection(view, item, tab) {

    const crId = $('#mgCreator').value;

/* ============================================================
   CAMPAIGN TAB — REPORT HAND-OFF
   The report itself is generated by the existing Vively Toolkit
   (성과 리포트 tab). This screen packages the campaign so the
   toolkit can ingest it with one CSV import — column names match
   its parser exactly: creator, platform, url, views, likes,
   comments, shares, saves, reach, countries, status.
   ============================================================ */
const TOOLKIT_FIELDS = ['creator', 'platform', 'url', 'views', 'likes', 'comments', 'shares', 'saves', 'reach', 'countries', 'status'];

function toolkitRows(cp) {
  return partsOf(cp.id).filter((p) => p.content).map((p) => {
    const cr = byCreator[p.creatorId], c = p.content;
    return [
      cr.handle, c.platform, c.url, c.views, c.likes, c.comments, c.shares, c.saves, c.reach,
      c.topCountries.join(' / '),
      p.stage === 'live' ? 'Posted' : p.stage === 'review' ? 'In review' : 'Waiting'
    ];
  });
}

function executiveSummary(cp) {
  const s = campaignStats(cp);
  const live = liveOf(cp.id);
  const top = live.map((p) => ({ p, v: viralScore(p) })).sort((a, b) => b.v - a.v)[0];
  const tierCount = {};
  live.forEach((p) => { const t = byCreator[p.creatorId].tier; tierCount[t] = (tierCount[t] || 0) + 1; });
  const tierText = Object.entries(tierCount).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${n} ${t}`).join(', ');

  return [
    `${cp.brand} — ${cp.name}. ${dLabel(cp.start)} to ${dLabel(cp.end)}, ${cp.market} market.`,
    ``,
    `We contacted ${s.contacted} creators and confirmed ${s.confirmed} against a target of ${cp.targetCreators} (${pct(s.confirmRate, 0)} of everyone contacted said yes). ${s.delivered} pieces of content went live — a ${pct(s.deliveryRate, 0)} delivery rate on confirmed creators.`,
    ``,
    `Those posts generated ${num(s.views)} views and ${num(s.reach)} in reach, with ${num(s.eng)} engagements at a ${pct(s.er)} engagement rate. ${s.paidViews ? `${pct(s.paidViews / s.views, 0)} of views came from paid boosting; the remaining ${pct(s.organicViews / s.views, 0)} were organic.` : 'All views were organic — no paid boosting was used.'}`,
    ``,
    `Total spend of ${wonK(s.spend)} works out to ${money2(s.cpm)} CPM, ${money2(s.cpv)} per view and ${money2(s.cpe)} per engagement — ${wonK(s.cpi)} per confirmed creator.`,
    ``,
    top ? `Best performing post: ${byCreator[top.p.creatorId].handle} with ${num(top.p.content.views)} views, ${top.v.toFixed(1)}× that creator's own baseline. ${s.viralCount > 1 ? `${s.viralCount} posts in total beat their baseline by 3× or more.` : ''}` : '',
    tierText ? `Creator mix: ${tierText}.` : '',
    ``,
    `Recommendation: ${s.viralCount ? 'boost the top performers with paid spend while they still have momentum, and re-book those creators first next round. ' : ''}${s.deliveryRate < 0.8 ? 'Delivery rate came in under 80% — tighten the confirmation step with a firmer posting date before shipping. ' : ''}${s.cpm < 3000 ? 'CPM is strong for this category; this creator mix is worth repeating.' : 'Consider shifting budget toward micro creators, where CPM was lowest.'}`
  ].filter((x) => x !== undefined).join('\n');
}

function segmentOf(id) { return CREATOR_SEGMENTS.find((s) => s.id === id) || CREATOR_SEGMENTS[0]; }

function filteredCreators(segId) {
  const seg = segmentOf(segId);
  const f = state.creatorFilters;
  const terms = f.q.trim() ? f.q.trim().toLowerCase().split(/\s+/) : [];
  const showBlocked = segId === 'blocked' || segId === 'all';
  return DB.creators.filter((c) => {
    if (!seg.test(c)) return false;
    if (isBlocked(c) && !showBlocked && SETTINGS.hideBlocked) return false;
    if (f.tier && c.tier !== f.tier) return false;
    if (f.cat && !c.categories.includes(f.cat)) return false;
    if (f.country && c.country !== f.country) return false;
    if (f.platform && c.platform !== f.platform) return false;
    if (!terms.length) return true;
    const hay = (c.handle + ' ' + c.name + ' ' + c.categories.join(' ') + ' ' + c.country + ' ' + c.platform + ' ' + c.tags.join(' ')).toLowerCase();
    return terms.every((t) => hay.includes(t));
  });
}

/* ============================================================
   XLSX — read and write .xlsx with no libraries and no CDN.
   An .xlsx is a ZIP of XML. We read the ZIP central directory
   and inflate with the browser's own DecompressionStream, then
   parse the sheet XML. Writing goes the other way, using STORED
   (uncompressed) entries so no compressor is needed.
   ============================================================ */

/* -------------------------------- ZIP read -------------------------------- */
async function unzip(arrayBuffer) {
  const dv = new DataView(arrayBuffer);
  const u8 = new Uint8Array(arrayBuffer);

  /* end-of-central-directory: scan backwards for the signature */
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid .xlsx file (no ZIP directory found).');

  const count = dv.getUint16(eocd + 10, true);
  let ptr = dv.getUint32(eocd + 16, true);
  const out = {};
  const dec = new TextDecoder();

  for (let n = 0; n < count; n++) {
    if (dv.getUint32(ptr, true) !== 0x02014b50) break;
    const method = dv.getUint16(ptr + 10, true);
    const compSize = dv.getUint32(ptr + 20, true);
    const fnLen = dv.getUint16(ptr + 28, true);
    const exLen = dv.getUint16(ptr + 30, true);
    const cmLen = dv.getUint16(ptr + 32, true);
    const local = dv.getUint32(ptr + 42, true);
    const name = dec.decode(u8.subarray(ptr + 46, ptr + 46 + fnLen));
    ptr += 46 + fnLen + exLen + cmLen;

    const lfnLen = dv.getUint16(local + 26, true);
    const lexLen = dv.getUint16(local + 28, true);
    const start = local + 30 + lfnLen + lexLen;
    const raw = u8.subarray(start, start + compSize);

    if (method === 0) out[name] = dec.decode(raw);
    else if (method === 8) out[name] = dec.decode(await inflateRaw(raw));
    /* any other method is skipped — Excel only ever writes 0 or 8 */
  }
  return out;
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined')
    throw new Error('This browser cannot unzip .xlsx files. Please save the sheet as CSV and import that instead.');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* ------------------------------ sheet parsing ------------------------------ */
const colIndex = (ref) => {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
};

const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
const serialToDate = (v) => new Date(EXCEL_EPOCH + Math.round(v * 86400000));
const DATE_FMT_IDS = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 45, 46, 47]);

function parseStyles(xml) {
  if (!xml) return new Set();
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const dateIds = new Set(DATE_FMT_IDS);
  doc.querySelectorAll('numFmt').forEach((f) => {
    const code = f.getAttribute('formatCode') || '';
    if (/[ymdhs]/i.test(code) && !/(\[|General)/i.test(code.slice(0, 2))) dateIds.add(+f.getAttribute('numFmtId'));
  });
  const xfs = doc.querySelector('cellXfs');
  const isDate = new Set();
  if (xfs) Array.from(xfs.children).forEach((xf, i) => {
    if (dateIds.has(+xf.getAttribute('numFmtId'))) isDate.add(i);
  });
  return isDate;
}

/* returns { sheets: [{name, rows}] } — rows are arrays of primitives */
async function readXlsx(file) {
  const files = await unzip(await file.arrayBuffer());
  const parser = new DOMParser();

  const shared = [];
  if (files['xl/sharedStrings.xml']) {
    const doc = parser.parseFromString(files['xl/sharedStrings.xml'], 'application/xml');
    doc.querySelectorAll('si').forEach((si) => {
      shared.push(Array.from(si.querySelectorAll('t')).map((t) => t.textContent).join(''));
    });
  }
  const dateStyles = parseStyles(files['xl/styles.xml']);

  /* sheet order + names from the workbook, paths from its rels */
  const rels = {};
  if (files['xl/_rels/workbook.xml.rels']) {
    parser.parseFromString(files['xl/_rels/workbook.xml.rels'], 'application/xml')
      .querySelectorAll('Relationship').forEach((r) => { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
  }
  const sheetDefs = [];
  if (files['xl/workbook.xml']) {
    parser.parseFromString(files['xl/workbook.xml'], 'application/xml')
      .querySelectorAll('sheets > sheet').forEach((s) => {
        const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
        let target = rels[rid] || '';
        if (target && !target.startsWith('/')) target = 'xl/' + target.replace(/^\.?\//, '');
        sheetDefs.push({ name: s.getAttribute('name'), path: target.replace(/^\//, '') });
      });
  }
  if (!sheetDefs.length) sheetDefs.push({ name: 'Sheet1', path: 'xl/worksheets/sheet1.xml' });

  const sheets = [];
  sheetDefs.forEach((def) => {
    const xml = files[def.path] || files[def.path.replace('xl/', 'xl/worksheets/')];
    if (!xml) return;
    const doc = parser.parseFromString(xml, 'application/xml');
    const rows = [];
    doc.querySelectorAll('sheetData > row').forEach((r) => {
      const rowIdx = +r.getAttribute('r') - 1;
      const arr = rows[rowIdx] || (rows[rowIdx] = []);
      r.querySelectorAll('c').forEach((c) => {
        const ref = c.getAttribute('r') || '';
        const ci = ref ? colIndex(ref) : arr.length;
        const t = c.getAttribute('t');
        let val = null;
        if (t === 's') {
          const v = c.querySelector('v');
          val = v ? shared[+v.textContent] : null;
        } else if (t === 'inlineStr') {
          val = Array.from(c.querySelectorAll('is t')).map((x) => x.textContent).join('');
        } else {
          const v = c.querySelector('v');
          if (v != null) {
            const raw = v.textContent;
            if (t === 'str' || t === 'e') val = raw;
            else {
              const nv = parseFloat(raw);
              const s = c.getAttribute('s');
              val = (!isNaN(nv) && s != null && dateStyles.has(+s)) ? serialToDate(nv) : (isNaN(nv) ? raw : nv);
            }
          }
        }
        arr[ci] = val;
      });
    });
    for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
    sheets.push({ name: def.name, rows });
  });
  return { sheets };
}

/* -------------------------------- ZIP write -------------------------------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* files: [{name, text}] — written STORED, which every unzipper accepts */
function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;

  files.forEach((f) => {
    const nameBytes = enc.encode(f.name);
    const data = enc.encode(f.text);
    const crc = crc32(data);

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true); lv.setUint16(6, 0, true); lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true); lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);

    parts.push(local, data);
    central.push(cd);
    offset += local.length + data.length;
  });

  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);

  return new Blob([...parts, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const xmlEsc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const colLetter = (n) => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };

/* rows: array of arrays of strings. Header row is bolded. */
function buildXlsx(sheetName, rows) {
  const sheetRows = rows.map((row, ri) => {
    const cells = row.map((val, ci) => {
      if (val == null || val === '') return '';
      const ref = colLetter(ci) + (ri + 1);
      if (typeof val === 'number') return `<c r="${ref}"><v>${val}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${ri === 0 ? ' s="1"' : ''}><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`;
    }).join('');
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join('');

  const widths = (rows[0] || []).map((h, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${Math.min(46, Math.max(14, String(h || '').length + 6))}" customWidth="1"/>`).join('');

  const files = [
    { name: '[Content_Types].xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name: '_rels/.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(sheetName).slice(0, 31)}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>` },
    { name: 'xl/worksheets/sheet1.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${widths}</cols><sheetData>${sheetRows}</sheetData></worksheet>` }
  ];
  return makeZip(files);
}

function downloadXlsx(sheetName, rows, filename) {
  const blob = buildXlsx(sheetName, rows);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
  toast('Downloaded ' + filename);
}

const normHeader = (h) => String(h == null ? '' : h).toLowerCase().replace(/[\s_\-().]+/g, ' ').trim();

function guessField(header, colIdx, sampleValues) {
  const h = normHeader(header);
  if (h) {
    for (const [key, aliases] of Object.entries(HEADER_ALIASES)) {
      if (aliases.some((a) => h === a)) return key;
    }
    for (const [key, aliases] of Object.entries(HEADER_ALIASES)) {
      if (aliases.some((a) => h.includes(a) || a.includes(h))) return key;
    }
  }
  /* the visit sheet has an unlabelled column holding the message that was sent */
  const long = sampleValues.filter((v) => typeof v === 'string' && v.length > 60).length;
  if (!h && long >= 2) return 'message';
  return 'skip';
}

function detectTemplate(mapping) {

/* ------------------------------ value parsing ------------------------------ */
function handleFromUrl(url, platform) {
  if (!url) return null;
  const s = String(url).trim();
  let m = s.match(/tiktok\.com\/@([^/?#\s]+)/i);
  if (m) return { handle: '@' + m[1], platform: 'TikTok' };
  m = s.match(/instagram\.com\/([^/?#\s]+)/i);
  if (m && !/^(p|reel|reels|stories|explore)$/i.test(m[1])) return { handle: '@' + m[1], platform: 'Instagram' };
  m = s.match(/youtube\.com\/@([^/?#\s]+)/i);
  if (m) return { handle: '@' + m[1], platform: 'YouTube' };
  if (/^@?[\w.]{2,40}$/.test(s)) return { handle: s.startsWith('@') ? s : '@' + s, platform: platform || 'Instagram' };
  return null;
}

function parseFollowers(v) {
  if (v == null || v === '') return { value: 0, warn: null };
  if (typeof v === 'number') {
    if (v > 0 && v < 100) return { value: Math.round(v * 1000), warn: 'read ' + v + ' as ' + Math.round(v * 1000) };
    return { value: Math.round(v), warn: null };
  }
  const s = String(v).replace(/[, ]/g, '').toLowerCase();
  let m = s.match(/^([\d.]+)만$/); if (m) return { value: Math.round(parseFloat(m[1]) * 10000), warn: null };
  m = s.match(/^([\d.]+)k$/);      if (m) return { value: Math.round(parseFloat(m[1]) * 1000), warn: null };
  m = s.match(/^([\d.]+)m$/);      if (m) return { value: Math.round(parseFloat(m[1]) * 1e6), warn: null };
  const n = parseFloat(s);
  if (isNaN(n)) return { value: 0, warn: 'could not read "' + v + '"' };
  if (n > 0 && n < 100) return { value: Math.round(n * 1000), warn: 'read ' + n + ' as ' + Math.round(n * 1000) };
  return { value: Math.round(n), warn: null };
}

function parseDateCell(v) {
  if (!v) return null;
  if (v instanceof Date && !isNaN(v)) return v;
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

/* --------------------------- parse sheet into rows --------------------------- */
function parseImportRows(rows, mapping) {
  const idx = {};
  Object.entries(mapping).forEach(([ci, key]) => { if (key !== 'skip') idx[key] = +ci; });
  const get = (row, key) => (idx[key] == null ? null : row[idx[key]]);

  const out = [];
  rows.forEach((row, i) => {
    if (!row || row.every((c) => c == null || c === '')) return;
    const igRaw = get(row, 'instagram');
    const ttRaw = get(row, 'tiktok');
    const id1 = handleFromUrl(igRaw, 'Instagram');
    const id2 = handleFromUrl(ttRaw, 'TikTok');
    const ident = id1 || id2;
    const nameRaw = get(row, 'fullName');
    const statusRaw = String(get(row, 'status') || '').trim();
    const mapped = STATUS_MAP[statusRaw.toLowerCase()] || null;
    const fol = parseFollowers(get(row, 'followers'));
    const issues = [];

    if (!ident && !nameRaw) return; /* genuinely empty row */
    if (!ident) issues.push('no Instagram / TikTok link — cannot match a creator');
    if (statusRaw && !mapped) issues.push(`status “${statusRaw}” not recognised, treated as Sourced`);
    if (fol.warn) issues.push('followers ' + fol.warn);

    const stage = (mapped || { stage: 'sourced' }).stage;
    if (stage === 'shipped' && idx.address != null && !get(row, 'address')) issues.push('marked for shipping but no address');

    out.push({
      rowNo: i + 2,
      handle: ident ? ident.handle : null,
      platform: ident ? ident.platform : 'Instagram',
      fullName: nameRaw ? String(nameRaw).trim() : (ident ? ident.handle : ''),
      address: get(row, 'address') ? String(get(row, 'address')).trim() : '',
      contact: get(row, 'contact') ? String(get(row, 'contact')).trim() : '',
      nationality: get(row, 'nationality') ? String(get(row, 'nationality')).trim() : '',
      visitAt: parseDateCell(get(row, 'visitAt')),
      arrivingDate: parseDateCell(get(row, 'arrivingDate')),
      instagram: igRaw ? String(igRaw).trim() : '',
      tiktok: ttRaw ? String(ttRaw).trim() : '',
      otherSns: get(row, 'otherSns') ? String(get(row, 'otherSns')).trim() : '',
      contentUrl: get(row, 'contentUrl') ? String(get(row, 'contentUrl')).trim() : '',
      message: get(row, 'message') ? String(get(row, 'message')).trim() : '',
      followers: fol.value,
      statusRaw,
      stage,
      dropReason: (mapped || {}).reason || (stage === 'dropped' ? 'Rejected' : null),
      issues
    });
  });
  return out;
}

function wireImportStep1() {
  const dz = $('#impDrop'), input = $('#impFile');
  dz.addEventListener('click', () => input.click());
  dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('drag'); if (e.dataTransfer.files[0]) loadImportFile(e.dataTransfer.files[0]); });
  input.addEventListener('change', () => { if (input.files[0]) loadImportFile(input.files[0]); });
}

async function loadImportFile(file) {
  const res = $('#impResult');
  res.innerHTML = `<div class="empty">Reading ${esc(file.name)}…</div>`;
  try {
    importState.file = file;
    if (/\.csv$/i.test(file.name)) {
      const text = await file.text();
      importState.sheets = [{ name: 'CSV', rows: parseCsvText(text) }];
    } else {
      const wb = await readXlsx(file);
      importState.sheets = wb.sheets.filter((s) => s.rows.length > 1);
      if (!importState.sheets.length) throw new Error('No rows found in that workbook.');
    }
    /* pick the sheet with the most rows — the creator list, not the Report tab */
    importState.sheetIdx = importState.sheets.reduce((best, s, i, arr) => (s.rows.length > arr[best].rows.length ? i : best), 0);
    applySheet();
  } catch (err) {
    res.innerHTML = `<div class="note warn"><strong>Could not read that file.</strong> ${esc(err.message)}</div>`;
  }
}

function parseCsvText(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const rows = [];
  lines.forEach((line) => {
    if (!line.trim()) return;
    const vals = []; let v = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"' && q && line[i + 1] === '"') { v += '"'; i++; }
      else if (ch === '"') q = !q;
      else if (ch === ',' && !q) { vals.push(v); v = ''; }
      else v += ch;
    }
    vals.push(v);
    rows.push(vals);
  });
  return rows;
}

function applySheet() {
  const sheet = importState.sheets[importState.sheetIdx];
  const rows = sheet.rows;
  importState.headers = rows[0] || [];
  importState.rows = rows.slice(1);

  const mapping = {};
  importState.headers.forEach((h, i) => {
    const samples = importState.rows.slice(0, 20).map((r) => r[i]).filter((x) => x != null && x !== '');
    mapping[i] = guessField(h, i, samples);
  });
  /* never map two columns to the same field */
  const seen = new Set();
  Object.keys(mapping).forEach((k) => {
    if (mapping[k] !== 'skip' && seen.has(mapping[k])) mapping[k] = 'skip';
    else if (mapping[k] !== 'skip') seen.add(mapping[k]);
  });
  importState.mapping = mapping;
  importState.template = detectTemplate(mapping);
  renderImportStep2();
}

function commitImport() {
  const st = importState;
  const merge = $('#impMerge').checked;
  const skipBlocked = $('#impSkipBlocked').checked;
  const template = st.template;

  const id = 'cp' + (DB.campaigns.length + 1) + Math.floor(rnd() * 900 + 100);
  const cost = +$('#impCost').value || 0;
  const target = +$('#impTarget').value || 30;
  const cp = {
    id,
    brand: $('#impBrand').value.trim() || 'Untitled brand',
    name: $('#impName').value.trim() || 'Imported campaign',
    kind: $('#impKind').value, category: $('#impCat').value, market: $('#impMarket').value,
    status: $('#impStatus').value,
    start: $('#impStart').value, end: $('#impEnd').value,
    targetCreators: target, minFollowers: 0,
    platforms: ['Instagram', 'TikTok'],
    deliverables: $('#impDeliv').value,
    budget: cost * target,
    productCostPer: cost, adSpend: 0,
    hashtags: ['#vively'], owner: 'Kunzang',
    note: $('#impNote').value,
    createdAt: iso(TODAY),
    fulfilment: template,                 /* delivery | visit */
    importedFrom: st.file.name
  };

  let created = 0, matched = 0, skipped = 0;
  st.parsed.forEach((r) => {
    if (!r.handle) { skipped++; return; }
    let cr = merge ? findCreatorByHandle(r.handle) : null;

    if (cr && skipBlocked && cr.flag === 'blocked') { skipped++; return; }

    if (!cr) {
      const crId = 'im' + (DB.creators.length + 1) + '-' + Math.floor(rnd() * 9999);
      cr = {
        id: crId, handle: r.handle, name: r.fullName || r.handle,
        platform: r.platform, followers: r.followers,
        er: 0, avgViews: Math.round(r.followers * 0.6),
        categories: [cp.category], country: countryOf(r.nationality),
        nationality: r.nationality, languages: ['EN'],
        tier: tierOf(r.followers).id, source: 'Excel import',
        rate: 0, reliability: null, avgTurnaroundDays: null,
        campaignsDone: 0, lastWorked: null,
        email: '', contact: r.contact, address: r.address,
        tags: [], notes: '', flag: null, flagReason: '', flagAt: null,
        campaignIds: [], contentCount: 0, totalViews: 0, bestViews: 0
      };
      DB.creators.push(cr); byCreator[crId] = cr; created++;
    } else {
      matched++;
      if (r.followers && !cr.followers) cr.followers = r.followers;
      if (r.contact && !cr.contact) cr.contact = r.contact;
      if (r.address && !cr.address) cr.address = r.address;
      if (r.nationality && !cr.nationality) cr.nationality = r.nationality;
    }

    const p = {
      id: cp.id + '-' + cr.id, campaignId: cp.id, creatorId: cr.id,
      stage: r.stage, source: 'Excel import', fee: 0,
      contactedAt: STAGE_IDX[r.stage] >= 1 ? cp.start : null,
      repliedAt: STAGE_IDX[r.stage] >= 2 && r.stage !== 'dropped' ? cp.start : null,
      confirmedAt: STAGE_IDX[r.stage] >= 4 && r.stage !== 'dropped' ? cp.start : null,
      shippedAt: STAGE_IDX[r.stage] >= 5 && r.stage !== 'dropped' ? (r.arrivingDate ? iso(r.arrivingDate) : cp.start) : null,
      dropReason: r.dropReason, revisions: 0, note: '',
      fullName: r.fullName, address: r.address, contact: r.contact,
      nationality: r.nationality,
      visitAt: r.visitAt ? r.visitAt.toISOString().slice(0, 16).replace('T', ' ') : '',
      arrivingDate: r.arrivingDate ? iso(r.arrivingDate) : '',
      otherSns: r.otherSns, importedStatus: r.statusRaw,
      content: null
    };
    if (r.contentUrl) {
      p.content = {
        url: r.contentUrl, platform: r.platform, format: 'Reel',
        postedAt: r.arrivingDate ? iso(r.arrivingDate) : iso(TODAY), submittedAt: iso(TODAY),
        views: 0, paidViews: 0, organicViews: 0, likes: 0, comments: 0, shares: 0, saves: 0,
        reach: 0, profileVisits: 0, followsGained: 0, linkClicks: 0,
        curve: [], boosted: false, viral: false, topCountries: [], thumbTint: avColor(cr.handle)
      };
    }
    DB.participants.push(p);
  });

  byCampaign[id] = cp;
  DB.campaigns.push(cp);

  /* never leave the database with two rows for the same person */
  const dedupe = mergeDuplicateCreators();
  closeDrawer();
  location.hash = '#/campaigns/' + id + '/roster';
  toast(`Imported ${created + matched} creators — ${created} new, ${matched} matched${skipped ? ', ' + skipped + ' skipped' : ''}` +
    (dedupe.mergedCreators ? `, ${dedupe.mergedCreators} duplicate${dedupe.mergedCreators === 1 ? '' : 's'} merged` : ''));
}

/* ============================================================
   GOOGLE SHEET SYNC
   The Sheet is the shared copy of the workspace. Each entity gets
   its own tab with plain columns, so the team can open the Sheet
   and read (or fix) anything without this dashboard.

   The endpoint URL and shared key live in this browser only —
   never in the HTML — so the file itself stays safe to share.
   ============================================================ */

const SYNC_KEY = 'vively-sync-v1';
const SYNC = { url: '', secret: '', auto: true, at: null, revision: 0, status: 'off', error: null, busy: false };
let syncTimer = null;
let lastPushedJson = '';

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_KEY);
    if (!raw) return;
    Object.assign(SYNC, JSON.parse(raw), { busy: false, error: null });
    if (SYNC.at) SYNC.at = new Date(SYNC.at);
    SYNC.status = SYNC.url ? 'idle' : 'off';
  } catch (e) { /* no config yet */ }
}
function saveSyncConfig() {
  try {
    localStorage.setItem(SYNC_KEY, JSON.stringify({
      url: SYNC.url, secret: SYNC.secret, auto: SYNC.auto,
      at: SYNC.at ? SYNC.at.toISOString() : null, revision: SYNC.revision
    }));
  } catch (e) { /* storage blocked */ }
}

/* ------------------------------ schema ------------------------------ */
/* type: s = string, n = number, b = boolean, a = array of strings, c = comma-joined numbers */
const SHEET_SCHEMA = {
  campaigns: [
    ['id','s'],['brand','s'],['name','s'],['kind','s'],['category','s'],['market','s'],['status','s'],
    ['start','s'],['end','s'],['targetCreators','n'],['minFollowers','n'],['platforms','a'],
    ['deliverables','s'],['budget','n'],['productCostPer','n'],['adSpend','n'],['hashtags','a'],
    ['owner','s'],['note','s'],['createdAt','s'],['fulfilment','s'],['importedFrom','s']
  ],
  creators: [
    ['id','s'],['handle','s'],['name','s'],['platform','s'],['followers','n'],['er','n'],['avgViews','n'],
    ['categories','a'],['country','s'],['nationality','s'],['languages','a'],['tier','s'],['source','s'],
    ['rate','n'],['reliability','n'],['avgTurnaroundDays','n'],['lastWorked','s'],['email','s'],
    ['contact','s'],['address','s'],['tags','a'],['notes','s'],['flag','s'],['flagReason','s'],['flagAt','s']
  ],
  participants: [
    ['id','s'],['campaignId','s'],['creatorId','s'],['stage','s'],['source','s'],['fee','n'],
    ['contactedAt','s'],['repliedAt','s'],['confirmedAt','s'],['shippedAt','s'],['dropReason','s'],
    ['revisions','n'],['note','s'],['fullName','s'],['address','s'],['contact','s'],['nationality','s'],
    ['visitAt','s'],['arrivingDate','s'],['otherSns','s'],['importedStatus','s'],
    ['content.url','s'],['content.platform','s'],['content.format','s'],['content.postedAt','s'],
    ['content.submittedAt','s'],['content.views','n'],['content.paidViews','n'],['content.organicViews','n'],
    ['content.likes','n'],['content.comments','n'],['content.shares','n'],['content.saves','n'],
    ['content.reach','n'],['content.profileVisits','n'],['content.followsGained','n'],['content.linkClicks','n'],
    ['content.boosted','b'],['content.topCountries','a'],['content.curve','c']
  ]
};

const getPath = (o, p) => p.split('.').reduce((x, k) => (x == null ? undefined : x[k]), o);
function setPath(o, p, v) {
  const parts = p.split('.');
  const last = parts.pop();
  let cur = o;
  parts.forEach((k) => { if (cur[k] == null) cur[k] = {}; cur = cur[k]; });
  cur[last] = v;
}

function encodeCell(v, type) {
  if (v == null) return '';
  if (type === 'a') return Array.isArray(v) ? v.join('|') : String(v);
  if (type === 'c') return Array.isArray(v) ? v.join(',') : String(v);
  if (type === 'b') return v ? 'TRUE' : 'FALSE';
  if (type === 'n') return v === '' ? '' : Number(v);
  return String(v);
}
function decodeCell(v, type) {
  const s = v == null ? '' : String(v).trim();
  if (type === 'a') return s ? s.split('|').filter(Boolean) : [];
  if (type === 'c') return s ? s.split(',').map(Number).filter((n) => !isNaN(n)) : [];
  if (type === 'b') return /^(true|1|yes)$/i.test(s);
  if (type === 'n') { if (s === '') return null; const n = Number(s.replace(/,/g, '')); return isNaN(n) ? null : n; }
  return s;
}

function entityToGrid(name) {
  const cols = SHEET_SCHEMA[name];
  const rows = [cols.map((c) => c[0])];
  DB[name].forEach((obj) => rows.push(cols.map(([k, t]) => encodeCell(getPath(obj, k), t))));
  return rows;
}

function gridToEntity(name, grid) {
  if (!grid || grid.length < 2) return [];
  const header = grid[0].map((h) => String(h).trim());
  const cols = SHEET_SCHEMA[name];
  return grid.slice(1).filter((r) => r.some((c) => c !== '' && c != null)).map((row) => {
    const obj = {};
    cols.forEach(([key, type]) => {
      const i = header.indexOf(key);
      if (i < 0) return;
      const val = decodeCell(row[i], type);
      if (key.startsWith('content.')) { if (val !== '' && val !== null && !(Array.isArray(val) && !val.length)) setPath(obj, key, val); }
      else obj[key] = val;
    });
    if (obj.content && !obj.content.url && !obj.content.views) obj.content = null;
    if (obj.content) {
      obj.content.thumbTint = avColor(obj.creatorId || obj.id || '');
      obj.content.viral = false;
      ['views','paidViews','organicViews','likes','comments','shares','saves','reach','profileVisits','followsGained','linkClicks']
        .forEach((k) => { if (obj.content[k] == null) obj.content[k] = 0; });
      if (!Array.isArray(obj.content.topCountries)) obj.content.topCountries = [];
      if (!Array.isArray(obj.content.curve)) obj.content.curve = [];
    } else obj.content = null;
    return obj;
  });
}

/* ------------------------------ transport ------------------------------ */
/* text/plain keeps the request "simple", so the browser skips the CORS
   preflight that Apps Script cannot answer */
async function sheetCall(action, body) {
  if (!SYNC.url) throw new Error('No Google Sheet endpoint configured.');
  const res = await fetch(SYNC.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, key: SYNC.secret }, body || {}))
  });
  if (!res.ok) throw new Error('Sheet responded ' + res.status);
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); }
  catch (e) { throw new Error('Unexpected reply — check the Web App is deployed with access set to "Anyone".'); }
  if (!json.ok) throw new Error(json.error || 'The Sheet rejected the request.');
  return json;
}

async function sheetPull(opts) {
  opts = opts || {};
  SYNC.busy = true; SYNC.status = 'syncing'; renderSyncUi();
  try {
    const json = await sheetCall('pull');
    const grids = json.data || {};
    const campaigns = gridToEntity('campaigns', grids.campaigns);
    const creators = gridToEntity('creators', grids.creators);
    const participants = gridToEntity('participants', grids.participants);

    if (!opts.silent && (DB.campaigns.length || DB.creators.length) &&
        !confirm(`Replace this browser's workspace (${DB.campaigns.length} campaigns, ${DB.creators.length} creators) with the Sheet's (${campaigns.length} campaigns, ${creators.length} creators)?`)) {
      SYNC.busy = false; SYNC.status = 'idle'; renderSyncUi(); return;
    }

    Object.keys(byCreator).forEach((k) => delete byCreator[k]);
    Object.keys(byCampaign).forEach((k) => delete byCampaign[k]);
    DB.campaigns = campaigns; DB.creators = creators; DB.participants = participants;
    DB.creators.forEach((c) => (byCreator[c.id] = c));
    DB.campaigns.forEach((c) => (byCampaign[c.id] = c));

    SYNC.revision = json.revision || 0;
    SYNC.at = new Date(); SYNC.error = null; SYNC.status = 'idle';
    lastPushedJson = JSON.stringify(DB);
    saveSyncConfig(); persist(true);
    toast(`Pulled ${campaigns.length} campaigns and ${creators.length} creators from the Sheet`);
    render();
  } catch (err) {
    SYNC.error = err.message; SYNC.status = 'error';
    toast('Pull failed — ' + err.message);
    renderSyncUi();
  } finally { SYNC.busy = false; }
}

async function sheetPush(opts) {
  opts = opts || {};
  if (!SYNC.url || SYNC.busy) return;
  SYNC.busy = true; SYNC.status = 'syncing'; renderSyncUi();
  try {
    const json = await sheetCall('push', {
      revision: SYNC.revision,
      force: !!opts.force,
      data: {
        campaigns: entityToGrid('campaigns'),
        creators: entityToGrid('creators'),
        participants: entityToGrid('participants')
      }
    });
    if (json.conflict) {
      SYNC.status = 'conflict';
      SYNC.error = `Someone else saved to the Sheet at ${new Date(json.updatedAt).toLocaleString()}. Pull their version, or push over it.`;
      renderSyncUi();
      if (!opts.silent) toast('Sheet has newer changes — resolve in Setup → Google Sheet');
      return;
    }
    SYNC.revision = json.revision;
    SYNC.at = new Date(); SYNC.error = null; SYNC.status = 'idle';
    lastPushedJson = JSON.stringify(DB);
    saveSyncConfig();
    if (!opts.silent) toast('Pushed to the Sheet');
    renderSyncUi();
  } catch (err) {
    SYNC.error = err.message; SYNC.status = 'error';
    if (!opts.silent) toast('Push failed — ' + err.message);
    renderSyncUi();
  } finally { SYNC.busy = false; }
}

/* called from persist() whenever the workspace actually changed */
function scheduleSheetPush(currentJson) {
  if (!SYNC.url || !SYNC.auto) return;
  if (currentJson === lastPushedJson) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => sheetPush({ silent: true }), 3000);
}

/* ============================================================
   DOCX writer — same trick as the XLSX one. A .docx is a ZIP of
   XML, and makeZip() already writes ZIPs, so Word documents come
   out of the browser with no library and no CDN.

   Blocks: {t:'h1'|'h2'|'h3'|'p'|'table'|'break'|'space', ...}
   ============================================================ */

const DOC_FONT_LATIN = 'Calibri';
const DOC_FONT_EAST  = 'Malgun Gothic';   /* so Korean renders on Windows and Mac */

function wRun(text, opt) {
  opt = opt || {};
  const props = [];
  if (opt.bold) props.push('<w:b/><w:bCs/>');
  if (opt.italic) props.push('<w:i/>');
  if (opt.size) props.push(`<w:sz w:val="${opt.size * 2}"/><w:szCs w:val="${opt.size * 2}"/>`);
  if (opt.color) props.push(`<w:color w:val="${opt.color}"/>`);
  const rPr = props.length ? `<w:rPr>${props.join('')}</w:rPr>` : '';
  /* keep manual line breaks */
  const parts = String(text == null ? '' : text).split('\n');
  const body = parts.map((s, i) => (i ? '<w:br/>' : '') + `<w:t xml:space="preserve">${xmlEsc(s)}</w:t>`).join('');
  return `<w:r>${rPr}${body}</w:r>`;
}

function wPara(runs, opt) {
  opt = opt || {};
  const p = [];
  if (opt.align) p.push(`<w:jc w:val="${opt.align}"/>`);
  const before = opt.before == null ? 0 : opt.before;
  const after = opt.after == null ? 120 : opt.after;
  p.push(`<w:spacing w:before="${before}" w:after="${after}" w:line="264" w:lineRule="auto"/>`);
  if (opt.indent) p.push(`<w:ind w:left="${opt.indent}"/>`);
  if (opt.keepNext) p.push('<w:keepNext/>');
  if (opt.border) p.push('<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="BFBFBF"/></w:pBdr>');
  const pPr = `<w:pPr>${p.join('')}</w:pPr>`;
  return `<w:p>${pPr}${Array.isArray(runs) ? runs.join('') : runs}</w:p>`;
}

function wCell(text, opt) {
  opt = opt || {};
  const shade = opt.shade ? `<w:shd w:val="clear" w:color="auto" w:fill="${opt.shade}"/>` : '';
  return `<w:tc><w:tcPr><w:tcW w:w="${opt.width || 0}" w:type="${opt.width ? 'dxa' : 'auto'}"/>${shade}
    <w:tcMar><w:top w:w="80" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tcMar>
    </w:tcPr>${wPara(wRun(text, { bold: opt.bold, size: opt.size || 10 }), { after: 0 })}</w:tc>`;
}

function wTable(rows, opt) {
  opt = opt || {};
  const widths = opt.widths || [];
  const borders = `<w:tblBorders>
    ${['top','left','bottom','right','insideH','insideV'].map((s) =>
      `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/>`).join('')}
  </w:tblBorders>`;
  const body = rows.map((row, ri) => `<w:tr>${row.map((cell, ci) =>
    wCell(cell, { width: widths[ci], bold: opt.headerRow && ri === 0, shade: opt.headerRow && ri === 0 ? 'F2F2F2' : null, size: opt.size })
  ).join('')}</w:tr>`).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>${borders}<w:tblLayout w:type="fixed"/></w:tblPr>${body}</w:tbl>`;
}

function blocksToXml(blocks) {
  return blocks.map((b) => {
    if (!b) return '';
    if (b.t === 'break') return `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
    if (b.t === 'space') return wPara(wRun(''), { after: b.after || 120 });
    if (b.t === 'table') return wTable(b.rows, { widths: b.widths, headerRow: b.headerRow, size: b.size });
    if (b.t === 'h1') return wPara(wRun(b.text, { bold: true, size: 18 }), { align: 'center', before: 120, after: 240 });
    if (b.t === 'h2') return wPara(wRun(b.text, { bold: true, size: 12 }), { before: 240, after: 100, keepNext: true });
    if (b.t === 'h3') return wPara(wRun(b.text, { bold: true, size: 10.5 }), { before: 160, after: 80, keepNext: true });
    if (b.t === 'sub') return wPara(wRun(b.text, { size: 10.5, color: '595959' }), { align: 'center', after: 200 });
    return wPara(wRun(b.text, { size: 10.5, bold: b.bold }), { after: b.after == null ? 120 : b.after, indent: b.indent });
  }).join('');
}

function buildDocx(blocks, title) {
  const sectPr = `<w:sectPr>
    <w:pgSz w:w="11906" w:h="16838"/>
    <w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/>
  </w:sectPr>`;

  const files = [
    { name: '[Content_Types].xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>` },
    { name: '_rels/.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>` },
    { name: 'docProps/core.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${xmlEsc(title || 'Agreement')}</dc:title><dc:creator>VIVELY Dashboard</dc:creator></cp:coreProperties>` },
    { name: 'word/_rels/document.xml.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'word/styles.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${DOC_FONT_LATIN}" w:hAnsi="${DOC_FONT_LATIN}" w:eastAsia="${DOC_FONT_EAST}" w:cs="${DOC_FONT_LATIN}"/><w:sz w:val="21"/><w:szCs w:val="21"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>` },
    { name: 'word/document.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${blocksToXml(blocks)}${sectPr}</w:body></w:document>` }
  ];
  return makeZip(files);
}

function downloadDocx(blocks, filename, title) {
  const blob = buildDocx(blocks, title);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
  toast('Downloaded ' + filename);
}

/* the same blocks rendered for the on-screen preview */
function blocksToHtml(blocks) {
  return blocks.map((b) => {
    if (!b) return '';
    if (b.t === 'break') return '<div class="doc-break"></div>';
    if (b.t === 'space') return '<div style="height:10px"></div>';
    if (b.t === 'table') return `<table class="doc-table"><tbody>${b.rows.map((r, ri) =>
      `<tr>${r.map((c) => `<${b.headerRow && ri === 0 ? 'th' : 'td'}>${esc(c).replace(/\n/g, '<br>')}</${b.headerRow && ri === 0 ? 'th' : 'td'}>`).join('')}</tr>`).join('')}</tbody></table>`;
    if (b.t === 'h1') return `<h1 class="doc-h1">${esc(b.text)}</h1>`;
    if (b.t === 'sub') return `<p class="doc-sub">${esc(b.text)}</p>`;
    if (b.t === 'h2') return `<h2 class="doc-h2">${esc(b.text)}</h2>`;
    if (b.t === 'h3') return `<h3 class="doc-h3">${esc(b.text)}</h3>`;
    return `<p class="doc-p${b.bold ? ' b' : ''}"${b.indent ? ' style="margin-left:16px"' : ''}>${esc(b.text).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

function blocksToText(blocks) {
  return blocks.map((b) => {
    if (!b) return '';
    if (b.t === 'break') return '\n\n———\n';
    if (b.t === 'space') return '';
    if (b.t === 'table') return b.rows.map((r) => r.join('\t')).join('\n');
    return b.text || '';
  }).filter(Boolean).join('\n\n');
}

/* ------------------------------ helpers ------------------------------ */
const blank = (n) => '_'.repeat(n || 20);
const fv = (v, n) => (v == null || String(v).trim() === '' ? blank(n) : String(v).trim());

function contractDate(isoStr, L) {
  if (!isoStr) return L === 'ko' ? '____년 __월 __일' : '____ Year __ Month __ Day';
  const d = new Date(isoStr + 'T00:00:00Z');
  if (isNaN(d)) return isoStr;
  if (L === 'ko') return `${d.getUTCFullYear()}년 ${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일`;
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
}
function contractMoney(f, L) {
  const sym = f.currency === 'USD' ? '$' : '₩';
  if (!f.fee || isNaN(Number(String(f.fee).replace(/,/g, '')))) return `${sym} ${blank(16)}`;
  return `${sym} ${nf.format(Math.round(Number(String(f.fee).replace(/,/g, ''))))}`;
}
function billingText(f, L) {
  if (f.billing === 'custom') return f.billingCustom || (L === 'ko' ? '(별도 협의)' : '(to be agreed separately)');
  return BILLING_PRESETS[f.billing][L] || BILLING_PRESETS['50_50'][L];
}
const P = (text, opt) => Object.assign({ t: 'p', text }, opt || {});
const H2 = (text) => ({ t: 'h2', text });

  b.push(P(ko

  b.push(H2(ko ? '제11조 (불가항력)' : 'Article 11 (Force Majeure)'));

  b.push(P(ko ? `3. 본 계약의 일부 조항이 무효 또는 집행 불가능하다고 판단되더라도 나머지 조항은 계속하여 완전한 효력을 가진다.`

  b.push(P(ko
    ? `본 계약은 ${f.governingLaw === 'Republic of Korea' ? '대한민국' : f.governingLaw} 법률에 따라 규율되고 해석되며, 본 계약과 관련하여 발생하는 분쟁의 제1심 관할법원은 ${f.jurisdiction === 'Seoul Central District Court' ? '서울중앙지방법원' : f.jurisdiction}으로 한다.`

    ? `양 당사자는 본 계약의 내용을 충분히 읽고 이해하였으며 이에 동의하고, 이를 증명하기 위하여 아래에 서명 또는 날인한다.`

  b.push({ t: 'space' });
  b.push(signatureTable(f, L));

}

/* ============================ 2. STATEMENT OF WORK ============================ */
function buildSOW(f, L) {
  const ko = L === 'ko';
  const b = [];
  const client = fv(f.clientName, 16);
  const agency = fv(f.agencyName, 10);

  b.push({ t: 'h1', text: ko ? '과업지시서 (STATEMENT OF WORK)' : 'STATEMENT OF WORK' });
  b.push(P(ko
    ? `본 과업지시서(이하 "본 SOW")는 ${contractDate(f.effectiveDate, L)}에 ${agency}("에이전시")와 ${client}("고객사") 간에 ${contractDate(f.masterDate, L)}자로 체결된 기본 용역 계약서(이하 "기본계약")에 따라 체결되며, 기본계약의 일부를 이룬다.`
    : `This Statement of Work (this "SOW") is entered into as of ${contractDate(f.effectiveDate, L)} by and between ${agency} ("Agency") and ${client} ("Client") pursuant to the Master Service Agreement dated ${contractDate(f.masterDate, L)} (the "Master Agreement"), and forms part of the Master Agreement.`));
  b.push(P(ko ? `기본계약과 본 SOW의 내용이 상충하는 경우 본 SOW가 우선한다.`
              : `In the event of any conflict between the Master Agreement and this SOW, this SOW shall prevail.`));

  b.push(H2(ko ? '1. 프로젝트 개요' : '1. Project Overview'));
  b.push(P((ko ? 'SOW 번호 / 캠페인명: ' : 'SOW No. / Campaign Name: ') + fv(f.campaignName, 32)));
  b.push(P((ko ? '캠페인 목적 및 개요: ' : 'Campaign Purpose and Overview: ') + fv(f.campaignPurpose, 32)));
  if (f.platforms) b.push(P((ko ? '플랫폼: ' : 'Platform: ') + f.platforms));

  b.push(H2(ko ? '2. 서비스 범위 및 결과물' : '2. Scope of Services and Deliverables'));
  const rows = [[ko ? '서비스 / 결과물' : 'Service / Deliverable', ko ? '플랫폼' : 'Platform', ko ? '수량' : 'Quantity', ko ? '기한' : 'Deadline']];
  const filled = (f.deliverables || []).filter((d) => d.service || d.platform || d.qty || d.deadline);
  (filled.length ? filled : [{}, {}, {}]).forEach((d) => rows.push([d.service || '', d.platform || '', d.qty || '', d.deadline || '']));
  b.push({ t: 'table', rows, widths: [3800, 2000, 1500, 2000], headerRow: true });

  b.push(H2(ko ? '3. 일정' : '3. Schedule'));
  b.push(P((ko ? '캠페인 기간: ' : 'Campaign Period: ') + contractDate(f.periodStart, L) + '  ~  ' + contractDate(f.periodEnd, L)));
  b.push(P((ko ? '주요 마일스톤: ' : 'Key Milestones: ') + fv(f.milestones, 32)));

  b.push(H2(ko ? '4. 용역비 및 지급조건' : '4. Service Fee and Payment Terms'));
  b.push(P((ko ? '총 용역비 (VAT 별도): ' : 'Total Service Fee (VAT excluded): ') + contractMoney(f, L)));
  b.push(P((ko ? '지급 조건: ' : 'Payment Schedule: ') + billingText(f, L) + ' ' + (ko
    ? `각 지급금은 해당 세금계산서 발행일로부터 ${f.netDays}일 이내에 현금으로 지급한다(기본계약 제4조).`
    : `Each payment due in cash within ${f.netDays} days of the corresponding tax invoice issuance date (per Article 4 of the Master Agreement).`)));

  b.push(H2(ko ? '5. 담당자' : '5. Contact Persons'));
  b.push(P((ko ? '고객사 담당자 / 연락처: ' : 'Client Contact / Phone: ') + fv(f.clientContact, 20) + (f.clientPhone ? ' / ' + f.clientPhone : '')));
  b.push(P((ko ? '에이전시 담당자 / 연락처: ' : 'Agency Contact / Phone: ') + fv(f.agencyContact, 20) + (f.agencyPhone ? ' / ' + f.agencyPhone : '')));

  b.push(H2(ko ? '6. 특기사항 / 전제조건' : '6. Special Notes / Assumptions'));
  b.push(P(fv(f.notes, 32)));

  b.push({ t: 'space' });
  b.push(P(ko ? `본 SOW는 기본계약과 함께 효력을 가지며, 양 당사자는 아래에 서명함으로써 본 SOW의 내용에 동의한다.`
              : `This SOW shall be effective together with the Master Agreement, and the Parties agree to the contents of this SOW by signing below.`));
  b.push({ t: 'space' });
  b.push(signatureTable(f, L));
  return b;
}

  b.push(H2(ko ? '7. 기타' : '7. General'));

    : `Matters not provided for in this Agreement are governed by separate written agreement between the Parties. Where a Master Service Agreement has been executed, the relevant provisions of that agreement apply.`));
  if (f.clauses.esign) {
    b.push({ t: 'h3', text: ko ? '7-1. 계약의 변경, 양도 및 전자서명' : '7-1. Amendment, Assignment and Electronic Signature' });
    b.push(P(ko
      ? `본 계약의 변경은 양 당사자가 서명한 서면에 의해서만 유효하며, 어느 당사자도 상대방의 사전 서면 동의 없이 본 계약상의 권리·의무를 제3자에게 양도할 수 없다. 본 계약은 전자서명법에 따른 전자서명 및 전자문서의 방식으로 체결될 수 있으며, 이는 서면 계약과 동일한 효력을 가진다.`

    b.push(P(ko
      ? `고객사는 에이전시가 본 캠페인 또는 용역 수행 과정에서 최초로 발굴, 섭외 또는 연결한 크리에이터에 대하여, 해당 캠페인 종료일로부터 ${f.nonCircMonths}개월간 에이전시의 사전 서면 동의 없이 에이전시를 배제하고 직접 또는 제3자를 통하여 광고, 협찬, 콘텐츠 제작, 공동구매, 앰배서더 활동 기타 이에 준하는 상업적 거래를 제안하거나 체결하여서는 아니 된다.`

  }

  b.push({ t: 'space' });
  b.push(P(ko
    ? `양 당사자는 본 계약의 내용을 충분히 이해하고 이에 동의하며, 이를 증명하기 위하여 아래에 서명 또는 날인한다.`
    : `Each Party acknowledges that it has fully understood and agrees to the contents of this Agreement, and in witness whereof signs or seals below.`));
  b.push({ t: 'space' });
  b.push(signatureTable(f, L));
  return b;
}

const CONTRACT_DOCS = {
  msa:   { id: 'msa',   label: 'Master Service Agreement', sub: 'long form, covers every SOW', build: buildMSA,
           file: 'MSA', ko: '기본 용역 계약서' },
  sow:   { id: 'sow',   label: 'Statement of Work',        sub: 'one project under an MSA',    build: buildSOW,
           file: 'SOW', ko: '과업지시서' },
  short: { id: 'short', label: 'Short-form Agreement',     sub: '약식 · single project, no MSA', build: buildShort,
           file: 'ShortForm', ko: '약식 서비스 계약서' }
};
const CONTRACT_TABS = [['draft', 'Draft'], ['clauses', 'Clauses & terms'], ['preview', 'Full preview']];
/* ============================================================
   VIEW — CONTRACTS
   layer 2 = which document · layer 3 = draft / clauses / preview
   ============================================================ */

function contractFileName(docId, L) {
  const d = CONTRACT_DOCS[docId];
  const who = (CONTRACT.clientName || 'Client').replace(/[^\w가-힣 .-]/g, '').trim().replace(/\s+/g, '_') || 'Client';
  return `${(CONTRACT.agencyName || 'ScoutLab').replace(/\W+/g, '')}_${d.file}_${who}_${L.toUpperCase()}.docx`;
}

function contractBlocks(docId) {
  return CONTRACT_DOCS[docId].build(CONTRACT, CONTRACT.lang);
}

function refreshContractPreview(docId) {
  const el = $('#docPreview');
  if (el) el.innerHTML = blocksToHtml(contractBlocks(docId));
  const warn = $('#docWarn');
  if (warn) warn.style.display = CONTRACT.clientName.trim() ? 'none' : '';
}

function contractToolbar(docId) {
  return `<div class="card-head" style="margin-bottom:14px">
    <div class="seg no-print" id="langSeg">
      <button data-l="en" class="${CONTRACT.lang === 'en' ? 'active' : ''}">English</button>
      <button data-l="ko" class="${CONTRACT.lang === 'ko' ? 'active' : ''}">한국어</button>
    </div>
    <div class="sp"></div>
    <button class="btn sm" id="docCopy">Copy text</button>
    <button class="btn sm" id="docPrint">Print / PDF</button>
    <button class="btn primary sm" id="docWord">Download .docx</button>
  </div>`;
}

function wireContractToolbar(docId) {
  $('#langSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    CONTRACT.lang = b.dataset.l; saveContractDefaults(); render();
  });
  $('#docWord').addEventListener('click', () => {
    if (!CONTRACT.clientName.trim() && !confirm('No client company name yet — the document will show blanks. Download anyway?')) return;
    downloadDocx(contractBlocks(docId), contractFileName(docId, CONTRACT.lang), CONTRACT_DOCS[docId].label);
  });
  $('#docPrint').addEventListener('click', () => window.print());
  $('#docCopy').addEventListener('click', () => copyText(blocksToText(contractBlocks(docId)), 'Contract text'));
}
